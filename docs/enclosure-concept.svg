<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 1340" width="1420" height="1340" font-family="Helvetica, Arial, sans-serif">
<rect width="1420" height="1340" fill="#ffffff"/>

<!-- ============ TITLE ============ -->
<text x="40" y="44" font-size="25" font-weight="700" fill="#111">EInk Modular — enclosure, rev B</text>
<text x="40" y="68" font-size="12.5" fill="#555">Geometry taken from the Waveshare 7.5" e-Paper specification, sheet 5 (Mechanical Drawing of EPD module). All dimensions mm.</text>
<text x="40" y="86" font-size="12" fill="#c0392b">rev B corrects rev A: active area is NOT centred · FPC is 24 mm and dictates driver-board placement · rear view added · mount dimensioned</text>
<line x1="40" y1="98" x2="1380" y2="98" stroke="#111" stroke-width="2"/>

<!-- ============ 1 · FRONT ============ -->
<text x="70" y="126" font-size="15" font-weight="700" fill="#111">1 · FRONT  (2 px/mm)</text>

<rect x="70" y="150" width="356" height="238" rx="9" fill="#f7f7f7" stroke="#111" stroke-width="2.5"/>
<rect x="77.8" y="157.8" width="340.4" height="222.4" fill="#fff" stroke="#999" stroke-width="1" stroke-dasharray="5 3"/>
<rect x="84.8" y="164.8" width="326.4" height="195.84" fill="#2b2b2b" stroke="#111" stroke-width="1.5"/>
<text x="248" y="256" font-size="12.5" fill="#eee" text-anchor="middle">active 163.20 × 97.92</text>
<text x="248" y="274" font-size="10.5" fill="#aaa" text-anchor="middle">800 × 480 · 0.205 mm pitch</text>

<rect x="77.8" y="360.64" width="340.4" height="19.56" fill="#fdebd0" stroke="#e67e22" stroke-width="1"/>
<text x="248" y="374" font-size="10.5" fill="#a04000" text-anchor="middle">9.78 border — COG driver IC + FPC exit</text>

<line x1="84.8" y1="152" x2="84.8" y2="164.8" stroke="#c0392b" stroke-width="1"/>
<text x="91" y="161" font-size="10" fill="#c0392b">3.50 top</text>

<line x1="440" y1="164.8" x2="440" y2="360.64" stroke="#111" stroke-width="1"/>
<line x1="434" y1="164.8" x2="446" y2="164.8" stroke="#111" stroke-width="1"/>
<line x1="434" y1="360.64" x2="446" y2="360.64" stroke="#111" stroke-width="1"/>
<text x="452" y="266" font-size="11" fill="#111">97.92</text>
<line x1="486" y1="157.8" x2="486" y2="380.2" stroke="#111" stroke-width="1"/>
<line x1="480" y1="157.8" x2="492" y2="157.8" stroke="#111" stroke-width="1"/>
<line x1="480" y1="380.2" x2="492" y2="380.2" stroke="#111" stroke-width="1"/>
<text x="498" y="272" font-size="11" fill="#111">111.20</text>

<line x1="70" y1="410" x2="426" y2="410" stroke="#111" stroke-width="1"/>
<line x1="70" y1="404" x2="70" y2="416" stroke="#111" stroke-width="1"/>
<line x1="426" y1="404" x2="426" y2="416" stroke="#111" stroke-width="1"/>
<rect x="222" y="400" width="52" height="18" fill="#fff"/>
<text x="248" y="414" font-size="11.5" fill="#111" text-anchor="middle">178.0</text>

<text x="70" y="440" font-size="11" fill="#c0392b">⚠ The window sits 3.5 from the top but 9.78 from the bottom. Centring it — as rev A did —</text>
<text x="70" y="456" font-size="11" fill="#c0392b">   puts the image 3.1 mm high in the aperture and exposes the panel's own chin.</text>
<text x="70" y="476" font-size="11" fill="#333">Let the body follow the panel: 7.4 bezel top and sides, 13.7 chin. That reads as deliberate,</text>
<text x="70" y="492" font-size="11" fill="#333">and the chin is exactly where the ribbon and driver board have to live anyway.</text>

<!-- ============ 2 · REAR ============ -->
<text x="560" y="126" font-size="15" font-weight="700" fill="#111">2 · REAR — FPC reach envelope  <tspan fill="#c0392b">(the constraint rev A missed)</tspan></text>

<rect x="560" y="150" width="356" height="238" rx="9" fill="#eef2f3" stroke="#111" stroke-width="2.5"/>
<rect x="567.8" y="157.8" width="340.4" height="222.4" fill="#f7f9f9" stroke="#999" stroke-width="1" stroke-dasharray="5 3"/>

<line x1="738" y1="168" x2="738" y2="386" stroke="#2980b9" stroke-width="1" stroke-dasharray="3 3"/>
<text x="746" y="180" font-size="9.5" fill="#2980b9">panel ℄ 85.10</text>
<text x="640" y="196" font-size="9.5" fill="#8e44ad">FPC ℄ 84.05 (1.05 left of ℄)</text>

<rect x="706.5" y="252" width="58.92" height="96.5" fill="#d6eaf8" stroke="#2980b9" stroke-width="1.5"/>
<text x="736" y="292" font-size="10" fill="#1b4f72" text-anchor="middle">driver bd</text>
<text x="736" y="306" font-size="9.5" fill="#1b4f72" text-anchor="middle">29.46 × 48.25</text>
<text x="800" y="344" font-size="9.5" fill="#c0392b">↙ connector end</text>

<rect x="690" y="352" width="92" height="26" fill="#abebc6" stroke="#27ae60" stroke-width="1.5"/>
<text x="736" y="369" font-size="10" fill="#145a32" text-anchor="middle">connector must land here</text>

<rect x="723.4" y="378" width="25" height="10" fill="#e67e22" stroke="#a04000" stroke-width="1"/>

<line x1="672" y1="378" x2="672" y2="352" stroke="#27ae60" stroke-width="1.2"/>
<line x1="666" y1="378" x2="678" y2="378" stroke="#27ae60" stroke-width="1.2"/>
<line x1="666" y1="352" x2="678" y2="352" stroke="#27ae60" stroke-width="1.2"/>
<text x="662" y="369" font-size="10.5" fill="#27ae60" text-anchor="end">≤17</text>

<rect x="590" y="215" width="96" height="160" fill="#fadbd8" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="638" y="290" font-size="10" fill="#922b21" text-anchor="middle">battery</text>
<text x="638" y="304" font-size="9.5" fill="#922b21" text-anchor="middle">50 × 80</text>

<rect x="790" y="230" width="106" height="78" fill="#fcf3cf" stroke="#b7950b" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="843" y="264" font-size="10" fill="#7d6608" text-anchor="middle">power module</text>
<text x="843" y="278" font-size="9.5" fill="#7d6608" text-anchor="middle">USB-C to edge</text>

<line x1="567.8" y1="400" x2="723.4" y2="400" stroke="#c0392b" stroke-width="1"/>
<line x1="567.8" y1="394" x2="567.8" y2="406" stroke="#c0392b" stroke-width="1"/>
<line x1="723.4" y1="394" x2="723.4" y2="406" stroke="#c0392b" stroke-width="1"/>
<text x="645" y="396" font-size="10.5" fill="#c0392b" text-anchor="middle">77.80</text>
<line x1="748.4" y1="400" x2="908.2" y2="400" stroke="#c0392b" stroke-width="1"/>
<line x1="908.2" y1="394" x2="908.2" y2="406" stroke="#c0392b" stroke-width="1"/>
<text x="828" y="396" font-size="10.5" fill="#c0392b" text-anchor="middle">79.90</text>
<text x="736" y="420" font-size="10.5" fill="#a04000" text-anchor="middle">FPC 12.50 w × 24.00 l × 0.13 t</text>

<text x="560" y="448" font-size="11" fill="#c0392b">⚠ This is what rev A got wrong. The ribbon is 24 mm and ends in a clamp — it does not reach</text>
<text x="560" y="464" font-size="11" fill="#c0392b">   a board parked wherever the 2D layout looked tidy.</text>
<text x="560" y="484" font-size="11" fill="#333">Budget: 24.00 − ~4 fold radius − ~3 insertion ≈ <tspan font-weight="700">17 mm usable travel</tspan> from the bottom edge.</text>
<text x="560" y="500" font-size="11" fill="#333">The board is therefore <tspan font-weight="700">centred on the ribbon, connector end down</tspan>. Battery and power</text>
<text x="560" y="516" font-size="11" fill="#333">module work around it, not the other way round.</text>

<!-- ============ 3 · FPC FOLD SECTION ============ -->
<text x="70" y="560" font-size="15" font-weight="700" fill="#111">3 · FPC FOLD — section at the bottom edge  (8 px/mm)</text>

<g transform="translate(96,596)">
  <rect x="0" y="0" width="250" height="12.8" fill="#d5d8dc" stroke="#111" stroke-width="1.2"/>
  <rect x="0" y="12.8" width="205" height="9.44" fill="#aed6f1" stroke="#111" stroke-width="1.2"/>
  <line x1="205" y1="12.8" x2="205" y2="22.24" stroke="#111" stroke-width="2"/>

  <path d="M 205 19 L 221 19 A 12 12 0 0 1 221 43 L 140 43"
        fill="none" stroke="#e67e22" stroke-width="3.5" stroke-linecap="round"/>

  <rect x="110" y="37" width="32" height="12" fill="#5d6d7e" stroke="#111" stroke-width="1"/>
  <text x="126" y="46" font-size="8.5" fill="#fff" text-anchor="middle">FFC</text>
  <rect x="30" y="49" width="140" height="12.8" fill="#d6eaf8" stroke="#2980b9" stroke-width="1.2"/>
  <text x="100" y="59" font-size="9.5" fill="#1b4f72" text-anchor="middle">driver board</text>

  <rect x="0" y="86" width="250" height="12.8" fill="#d5d8dc" stroke="#111" stroke-width="1.2"/>

  <text x="258" y="9" font-size="10" fill="#111">bezel 1.60</text>
  <text x="258" y="22" font-size="10" fill="#111">glass 1.18</text>
  <text x="258" y="40" font-size="10" fill="#a04000">FPC 24.00, R ≥ 1.5</text>
  <text x="258" y="59" font-size="10" fill="#1b4f72">driver board</text>
  <text x="258" y="96" font-size="10" fill="#111">rear shell 1.60</text>

  <line x1="-16" y1="22.24" x2="-16" y2="86" stroke="#27ae60" stroke-width="1.4"/>
  <line x1="-22" y1="22.24" x2="-10" y2="22.24" stroke="#27ae60" stroke-width="1.4"/>
  <line x1="-22" y1="86" x2="-10" y2="86" stroke="#27ae60" stroke-width="1.4"/>
  <text x="-26" y="50" font-size="11.5" font-weight="700" fill="#27ae60" text-anchor="end">cavity</text>
  <text x="-26" y="65" font-size="11.5" font-weight="700" fill="#27ae60" text-anchor="end">8.0</text>
</g>

<text x="70" y="722" font-size="11" fill="#333">The 180° fold sets the cavity depth — not the tallest component. A 0.13 mm</text>
<text x="70" y="738" font-size="11" fill="#333">polyimide FPC takes R 1.5, but loop + connector + PCB stacks to <tspan font-weight="700">~8 mm</tspan>.</text>
<text x="70" y="754" font-size="11" fill="#333">Rev A's 6.5 cavity could not have closed. New total: <tspan font-weight="700">14.1 mm</tspan>.</text>
<text x="70" y="774" font-size="11" fill="#c0392b">Never crease the FPC — a sharp fold cracks the traces, and the panel</text>
<text x="70" y="790" font-size="11" fill="#c0392b">is not repairable.</text>

<!-- ============ 4 · THREE WAYS OUT ============ -->
<text x="560" y="560" font-size="15" font-weight="700" fill="#111">4 · THREE WAYS TO RESOLVE IT</text>

<g transform="translate(560,576)">
  <rect x="0" y="0" width="272" height="92" rx="4" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
  <text x="10" y="20" font-size="12" font-weight="700" fill="#145a32">A · Fold back, board on the panel</text>
  <text x="10" y="38" font-size="10.5" fill="#333">Board flat on the panel rear, connector within</text>
  <text x="10" y="52" font-size="10.5" fill="#333">17 mm of the bottom edge. No extra parts.</text>
  <text x="10" y="70" font-size="10.5" fill="#c0392b">Needs the connector at a board END — unverified.</text>
  <text x="10" y="85" font-size="10.5" fill="#145a32">Body 178 × 119, cavity 8.0 → 14.1 thick.</text>

  <rect x="292" y="0" width="272" height="92" rx="4" fill="#fef9e7" stroke="#b7950b" stroke-width="1.5"/>
  <text x="302" y="20" font-size="12" font-weight="700" fill="#7d6608">B · Chin — board below the panel</text>
  <text x="302" y="38" font-size="10.5" fill="#333">Ribbon runs straight down into a 20 mm chin.</text>
  <text x="302" y="52" font-size="10.5" fill="#333">No fold, so the cavity drops back to 6.5.</text>
  <text x="302" y="70" font-size="10.5" fill="#333">Chin also takes buttons / speaker grille.</text>
  <text x="302" y="85" font-size="10.5" fill="#7d6608">Body 178 × 139 → 12.6 thick. Slimmer, taller.</text>
</g>

<g transform="translate(560,684)">
  <rect x="0" y="0" width="564" height="80" rx="4" fill="#eaf2f8" stroke="#2980b9" stroke-width="1.5"/>
  <text x="10" y="21" font-size="12" font-weight="700" fill="#1b4f72">C · FFC extender — 24-pin, 0.5 mm pitch  ⭐ removes the constraint entirely</text>
  <text x="10" y="40" font-size="10.5" fill="#333">A 24-pin 0.5 mm extension board (two connectors back to back) plus a 100–150 mm FFC lets the driver board go</text>
  <text x="10" y="55" font-size="10.5" fill="#333">anywhere. SPI here runs at a few MHz over ~150 mm — signal integrity is a non-issue at that length.</text>
  <text x="10" y="72" font-size="10.5" fill="#c0392b">Watch contact polarity: type-A (contacts same side) vs type-D (opposite). The wrong one silently reverses the pinout.</text>
</g>

<!-- ============ 5 · MOUNT ============ -->
<text x="70" y="838" font-size="15" font-weight="700" fill="#111">5 · MOUNT — dimensioned, not a sketch</text>

<line x1="90" y1="1120" x2="600" y2="1120" stroke="#111" stroke-width="2"/>
<text x="610" y="1125" font-size="11" fill="#666">desk</text>

<g transform="translate(300,1120) rotate(-30)">
  <rect x="-11.3" y="-190.4" width="22.6" height="190.4" rx="3" fill="#d5d8dc" stroke="#111" stroke-width="2"/>
  <rect x="-6" y="-178" width="12" height="148" fill="#2b2b2b"/>
</g>
<path d="M 300 1120 L 204 1120 L 204 1111 L 293 1085 Z" fill="#eaeded" stroke="#111" stroke-width="2"/>
<circle cx="300" cy="1092" r="5.5" fill="#fff" stroke="#c0392b" stroke-width="2"/>
<circle cx="300" cy="1092" r="1.8" fill="#555"/>
<text x="316" y="1082" font-size="10.5" fill="#c0392b">pivot M3 — 28 above base,</text>
<text x="316" y="1096" font-size="10.5" fill="#c0392b">12 forward of the rear face</text>

<line x1="204" y1="1146" x2="300" y2="1146" stroke="#27ae60" stroke-width="1.2"/>
<line x1="204" y1="1140" x2="204" y2="1152" stroke="#27ae60" stroke-width="1.2"/>
<line x1="300" y1="1140" x2="300" y2="1152" stroke="#27ae60" stroke-width="1.2"/>
<text x="252" y="1162" font-size="11" fill="#27ae60" text-anchor="middle">foot 60 @ 30°</text>
<text x="252" y="1177" font-size="9.5" fill="#666" text-anchor="middle">CoM setback 27.5 × 1.7 + margin</text>
<text x="252" y="1192" font-size="9.5" fill="#666" text-anchor="middle">15° → 24 · 45° → 66 · 65° → 85</text>

<g transform="translate(700,838)">
  <text x="0" y="0" font-size="13" font-weight="700" fill="#111">Bracket pair — printed into the rear shell</text>
  <rect x="0" y="16" width="120" height="150" rx="5" fill="#eaeded" stroke="#111" stroke-width="2"/>
  <circle cx="60" cy="58" r="16" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <circle cx="60" cy="58" r="5" fill="#555"/>
  <path d="M 60 58 L 60 150" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>

  <line x1="0" y1="182" x2="120" y2="182" stroke="#111" stroke-width="1"/>
  <line x1="0" y1="176" x2="0" y2="188" stroke="#111" stroke-width="1"/>
  <line x1="120" y1="176" x2="120" y2="188" stroke="#111" stroke-width="1"/>
  <text x="60" y="197" font-size="10.5" fill="#111" text-anchor="middle">36 wall-to-wall</text>

  <line x1="-18" y1="16" x2="-18" y2="166" stroke="#111" stroke-width="1"/>
  <line x1="-24" y1="16" x2="-12" y2="16" stroke="#111" stroke-width="1"/>
  <line x1="-24" y1="166" x2="-12" y2="166" stroke="#111" stroke-width="1"/>
  <text x="-28" y="94" font-size="10.5" fill="#111" text-anchor="end">45</text>

  <text x="146" y="42" font-size="10.5" fill="#c0392b">Ø3.2 through both cheeks</text>
  <text x="146" y="58" font-size="10.5" fill="#666">M3 × 30 + nyloc, nylon washer each side —</text>
  <text x="146" y="72" font-size="10.5" fill="#666">friction set by nut torque, no printed spring</text>
  <text x="146" y="94" font-size="10.5" fill="#333">Cheek wall 3.0 · gap 8.4 for the foot tongue</text>
  <text x="146" y="110" font-size="10.5" fill="#333">Foot tongue 8.0 thick × 34 wide × 55 long</text>
  <text x="146" y="126" font-size="10.5" fill="#27ae60">Range 15–65°, hard stops moulded at both ends</text>
  <text x="146" y="142" font-size="10.5" fill="#666">Two TPU pads at the foot tip, two under the body</text>
  <text x="146" y="164" font-size="10.5" fill="#333">Pivot forward of the rear face so the foot swings</text>
  <text x="146" y="178" font-size="10.5" fill="#333">clear of the desk instead of jacking the body up</text>
</g>

<!-- ============ NOTES ============ -->
<line x1="40" y1="1214" x2="1380" y2="1214" stroke="#111" stroke-width="1.5"/>
<text x="40" y="1238" font-size="13" font-weight="700" fill="#c0392b">STILL UNVERIFIED — each of these changes the design, and I could not resolve them from datasheets</text>
<text x="40" y="1260" font-size="11.5" fill="#333">1 · Where is the FFC connector on the driver board, and how far from the board edge? Decides A vs B vs C. Waveshare publishes a schematic, not a PCB drawing.</text>
<text x="40" y="1278" font-size="11.5" fill="#333">2 · Battery actual L × W × T. 6 mm fits the cavity; 10 mm does not, and the body grows by the difference.</text>
<text x="40" y="1296" font-size="11.5" fill="#333">3 · Does the ribbon reach comfortably on your assembled unit, or is it under tension today? If it is tight now, option C is the answer regardless of the rest.</text>
<text x="40" y="1320" font-size="11" fill="#888">Panel geometry verified against Waveshare 7.5" e-Paper specification sheet 5 · body/foot PETG · bezel PLA Matte · brackets PETG-CF · pads TPU 95A</text>
</svg>
