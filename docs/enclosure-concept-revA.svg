<rect x="278" y="299" width="96.5" height="59" fill="none" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="326" y="333" font-size="10.5" fill="#58d68d" text-anchor="middle">driver bd</text>

<!-- FPC slot -->
<rect x="230" y="358" width="40" height="8" fill="#e67e22"/>

<!-- legend below the width dim -->
<text x="70" y="432" font-size="11" fill="#2980b9">▭ battery 605080 · 80 × 50 footprint, 6.0 thick — sits at the BOTTOM of the cavity</text>
<text x="70" y="449" font-size="11" fill="#27ae60">▭ driver board 48.25 × 29.46 — beside the FPC exit, wires soldered direct (no headers)</text>
<text x="70" y="466" font-size="11" fill="#e67e22">▬ FPC slot 20 × 4, R2 corners — the flex cable is fragile and not replaceable</text>
<text x="70" y="483" font-size="11" fill="#777">Both parts lie flat in the same 6.5 mm layer; interior is ~170 × 111 with room to spare.</text>

