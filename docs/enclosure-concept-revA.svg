<!-- ============ VIEW 4 — HINGE ============ -->
<text x="1110" y="540" font-size="15" font-weight="700" fill="#111">4 · HINGE</text>

<!-- H1 -->
<text x="1110" y="572" font-size="13" font-weight="700" fill="#27ae60">H1 · M3 friction pivot ⭐</text>
<g transform="translate(1110,584)">
  <rect x="0" y="0" width="40" height="58" rx="4" fill="#d5d8dc" stroke="#111" stroke-width="1.5"/>
  <rect x="46" y="12" width="40" height="58" rx="4" fill="#eaeded" stroke="#111" stroke-width="1.5"/>
  <circle cx="34" cy="26" r="9" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <circle cx="34" cy="26" r="3.4" fill="#555"/>
  <line x1="34" y1="26" x2="120" y2="26" stroke="#c0392b" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="124" y="24" font-size="11" fill="#c0392b">Ø3.2 bore</text>
  <text x="124" y="38" font-size="11" fill="#666">M3×35 + nyloc</text>
  <text x="124" y="52" font-size="11" fill="#666">nylon washer ×2</text>
</g>
<text x="1110" y="672" font-size="11" fill="#666">Infinitely adjustable. Friction set by</text>
<text x="1110" y="687" font-size="11" fill="#666">nut torque. Survives knocks. Start here.</text>

<!-- H2 -->
<text x="1110" y="720" font-size="13" font-weight="700" fill="#b7950b">H2 · printed detent ratchet</text>
<g transform="translate(1110,732)">
  <path d="M 0 40 A 40 40 0 0 1 40 0" fill="none" stroke="#111" stroke-width="1.5"/>
  <g stroke="#111" stroke-width="1.2" fill="#f9e79f">
    <path d="M 4.5 32 l 6 3 l -3 6 z"/><path d="M 11 24 l 6.5 2 l -2 6.5 z"/>
    <path d="M 19 17 l 6.5 1 l -1 6.5 z"/><path d="M 27.5 12 l 6 0.5 l -0.5 6 z"/>
    <path d="M 36 9 l 6 0 l 0 6 z"/>
  </g>
  <path d="M 58 6 q 16 20 0 40" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="74" y="22" font-size="11" fill="#c0392b">leaf spring</text>
  <text x="74" y="36" font-size="11" fill="#666">6 pos · 10° steps</text>
  <text x="74" y="50" font-size="11" fill="#666">boss Ø1.2</text>
</g>
<text x="1110" y="812" font-size="11" fill="#c0392b">⚠ PLA springs creep — print the arm</text>
<text x="1110" y="827" font-size="11" fill="#c0392b">in PETG, never in CF.</text>

<!-- H3 -->
<text x="1110" y="860" font-size="13" font-weight="700" fill="#2980b9">H3 · separate wedge dock</text>
<g transform="translate(1110,872)">
  <path d="M 0 46 L 92 46 L 92 6 Z" fill="#eaeded" stroke="#111" stroke-width="1.5"/>
  <rect x="58" y="-12" width="10" height="40" rx="2" fill="#d5d8dc" stroke="#111" stroke-width="1.5" transform="rotate(-30 63 8)"/>
  <text x="0" y="66" font-size="11" fill="#666">Slab body + printed wedge.</text>
  <text x="0" y="80" font-size="11" fill="#666">Slimmest panel; fixed angles.</text>
</g>

<!-- ============ NOTES ============ -->
<line x1="40" y1="1000" x2="1340" y2="1000" stroke="#111" stroke-width="1.5"/>
<text x="40" y="1024" font-size="13" font-weight="700" fill="#111">BUILD NOTES</text>
<text x="40" y="1046" font-size="11.5" fill="#333">• Print the body FACE-DOWN — the bezel face is the visible surface, lands on the plate, and the aperture needs no supports.</text>
<text x="40" y="1064" font-size="11.5" fill="#333">• Rear shell is a separate part: 6 × M3×5×4 heat-set inserts around the perimeter.</text>
<text x="40" y="1082" font-size="11.5" fill="#333">• Clearances on a tuned A1: 0.20 mm sliding fits, 0.10 mm press fits. Glass pocket 170.7 × 111.7 × 1.3 deep (+0.25/side).</text>
<text x="40" y="1100" font-size="11.5" fill="#333">• USB-C cut-out 12 × 7 — position depends on where the charger module sits. Decide that BEFORE modelling the rear shell.</text>
<text x="40" y="1118" font-size="11.5" fill="#333">• No ventilation needed (milliwatts). Seal it. Four TPU pads on the base + foot tip.</text>
<text x="40" y="1136" font-size="11.5" fill="#c0392b">• ⚠ Battery thickness decides everything: a 605080 cell (6 mm) fits the 6.5 mm cavity. A 10 mm cell pushes the body to ~17 mm.</text>
<text x="40" y="1160" font-size="11" fill="#888">Materials — body/foot: PETG · front bezel: PLA Matte · thin stiff parts: PETG-CF (hardened nozzle) · feet: TPU 95A</text>
</svg>
