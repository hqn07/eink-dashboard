<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 1180" width="1380" height="1180" font-family="Helvetica, Arial, sans-serif">
<rect width="1380" height="1180" fill="#ffffff"/>

<!-- ============ TITLE BLOCK ============ -->
<text x="40" y="46" font-size="26" font-weight="700" fill="#111">EInk Modular — enclosure concept</text>
<text x="40" y="70" font-size="13" fill="#555">Waveshare 7.5" B (170.2 × 111.2 × 1.18 mm glass · 163.2 × 97.92 mm active) · desk stand, adjustable 15–65°</text>
<text x="40" y="88" font-size="12" fill="#888">All dimensions in mm. Front + section views at 2 px/mm. 2026-09-17</text>
<line x1="40" y1="100" x2="1340" y2="100" stroke="#111" stroke-width="2"/>

<!-- ============ VIEW 1 — FRONT ============ -->
<text x="70" y="128" font-size="15" font-weight="700" fill="#111">1 · FRONT  (scale 2 px/mm)</text>

