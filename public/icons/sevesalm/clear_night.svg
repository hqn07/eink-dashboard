<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" id="Layer_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
  viewBox="0 0 130 130" stroke="black" fill="white"
  stroke-width="6">
  <!-- Crescent moon: outer arc of a big circle, inner arc cut back.
       Stars alone read as random specks at e-ink sizes; the moon makes
       "clear night" legible at a glance. -->
  <path d="M 84 28 A 36 36 0 1 0 110 80 A 30 30 0 0 1 84 28 z" stroke-linejoin="round" />
  <path id="star" d="M 0 -10 L -2.9 -4 -9.5 -3.1 -4.7 1.5 -5.9 8.1 0 5 5.9 8.1 4.8 1.5 9.5 -3.1 2.9 -4 z"
    transform="translate(28 32)" stroke-width="4" />
  <use xlink:href="#star" transform="translate(-8 28)" />
  <use xlink:href="#star" transform="translate(8 58)" />
</svg>
