<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>E-Ink Dashboard</title>
<link rel="stylesheet" href="/static/dashboard.css">
<script>/*__DATA__*/</script>
</head>
<body>
<div class="page" id="page">
  <!-- Filled by JS from window.__DASHBOARD__ -->
</div>

<script>
(function() {
  const D = window.__DASHBOARD__ || {};
  const cfg = D.cfg || {};
  const w = D.weather;
  const events = D.events || [];
  const todos = (cfg.todos || []).slice(0, 6);
  const widgets = cfg.widgets || {};
  const units = D.units || cfg.units || 'F';
  const screen = D.screen || cfg.screen || 1;
  document.body.setAttribute('data-screen', String(screen));
  document.body.setAttribute('data-units', units);

  // ============ GRID CONFIG ============
  const GRID_COLS = 12;
  const GRID_ROWS = 6;

  function el(tag, cls, html) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  // Icon SVGs — pure black/white, scale to any size via CSS
  const ICONS = {
    Clear: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="22" fill="#000"/>
      ${Array.from({length:8}, (_,i)=>{
        const a = i*Math.PI/4;
        const x1 = 50 + 30*Math.cos(a), y1 = 50 + 30*Math.sin(a);
        const x2 = 50 + 42*Math.cos(a), y2 = 50 + 42*Math.sin(a);
        return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#000" stroke-width="5" stroke-linecap="round"/>`;
      }).join('')}</svg>`,
    Clouds: `<svg viewBox="0 0 100 100">
      <path d="M 25 65 Q 15 65 15 55 Q 15 45 25 45 Q 25 30 40 30 Q 55 30 58 45 Q 75 45 75 60 Q 75 70 65 70 L 25 70 Z"
        fill="#000"/></svg>`,
    Rain: `<svg viewBox="0 0 100 100">
      <path d="M 25 50 Q 15 50 15 40 Q 15 30 25 30 Q 25 18 40 18 Q 55 18 58 30 Q 75 30 75 45 Q 75 55 65 55 L 25 55 Z"
        fill="#000"/>
      <line x1="30" y1="65" x2="26" y2="80" stroke="#000" stroke-width="4" stroke-linecap="round"/>
      <line x1="50" y1="65" x2="46" y2="80" stroke="#000" stroke-width="4" stroke-linecap="round"/>
      <line x1="70" y1="65" x2="66" y2="80" stroke="#000" stroke-width="4" stroke-linecap="round"/>
    </svg>`,
    Thunderstorm: `<svg viewBox="0 0 100 100">
      <path d="M 25 45 Q 15 45 15 35 Q 15 25 25 25 Q 25 12 40 12 Q 55 12 58 25 Q 75 25 75 40 Q 75 50 65 50 L 25 50 Z"
        fill="#000"/>
      <polygon points="48,55 38,75 48,75 42,90 60,68 50,68 56,55" fill="#000"/>
    </svg>`,
    Snow: `<svg viewBox="0 0 100 100">
      <path d="M 25 45 Q 15 45 15 35 Q 15 25 25 25 Q 25 12 40 12 Q 55 12 58 25 Q 75 25 75 40 Q 75 50 65 50 L 25 50 Z"
        fill="#000"/>
      ${[30,50,70].map(x => `
        <g stroke="#000" stroke-width="3" stroke-linecap="round">
          <line x1="${x-6}" y1="70" x2="${x+6}" y2="70"/>
          <line x1="${x}" y1="64" x2="${x}" y2="76"/>
          <line x1="${x-4}" y1="66" x2="${x+4}" y2="74"/>
          <line x1="${x-4}" y1="74" x2="${x+4}" y2="66"/>
        </g>
      `).join('')}
    </svg>`,
    Mist: `<svg viewBox="0 0 100 100">
      ${[30,45,60,75].map((y,i) => `
        <line x1="${15 + (i%2)*5}" y1="${y}" x2="${85 - (i%2)*5}" y2="${y}"
          stroke="#000" stroke-width="5" stroke-linecap="round"/>
      `).join('')}
    </svg>`
  };
  ICONS.Drizzle = ICONS.Rain;
  ICONS.Fog = ICONS.Mist;
  ICONS.Haze = ICONS.Mist;

  function icon(main, size) {
    const svg = ICONS[main] || ICONS.Clear;
    return `<span class="icon" style="width:${size}px;height:${size}px">${svg}</span>`;
  }

  // ============ WIDGET REGISTRY ============
  // Each widget: { id, label, requires, defaultLayout, render(ctx) -> HTML | '' }
  // requires = which boolean in cfg.widgets must be true (legacy fallback)
  // render returns '' if data missing, signalling the cell to skip.
  const WIDGET_REGISTRY = [
    {
      id: 'weather_hero',
      label: 'Weather (current)',
      requires: 'weather',
      defaultLayout: { x: 0, y: 0, w: 4, h: 6 },
      render: ({ weather, units }) => {
        if (!weather) return '';
        return `
          <div class="weather-hero">
            <div class="weather-icon">${icon(weather.main, 130)}</div>
            <div class="weather-temp">
              <span class="temp-num">${weather.temp}</span><span class="temp-deg">°${units}</span>
            </div>
            <div class="weather-desc">${weather.desc}</div>
            <div class="weather-hilo">HIGH ${weather.tempMax}° &nbsp;·&nbsp; LOW ${weather.tempMin}°</div>
          </div>
          <div class="weather-stats">
            <div class="stat"><span class="stat-k">FEELS</span><span class="stat-v">${weather.feelsLike}°</span></div>
            <div class="stat"><span class="stat-k">HUMID</span><span class="stat-v">${weather.humidity}%</span></div>
            <div class="stat"><span class="stat-k">WIND</span><span class="stat-v">${weather.windDir} ${weather.windSpeed} ${weather.windUnit || ''}</span></div>
            <div class="stat"><span class="stat-k">RISE</span><span class="stat-v">${weather.sunrise}</span></div>
          </div>
        `;
      }
    },
    {
      id: 'weather_forecast',
      label: '3-Day Forecast',
      requires: 'weather',
      defaultLayout: { x: 4, y: 0, w: 3, h: 6 },
      render: ({ weather }) => {
        if (!weather || !weather.forecast || !weather.forecast.length) return '';
        return `
          <div class="col-title">3-DAY OUTLOOK</div>
          ${weather.forecast.map(f => `
            <div class="fc-row">
              <div class="fc-day">${f.name}</div>
              <div class="fc-icon">${icon(f.main, 38)}</div>
              <div class="fc-hilo">
                <div class="fc-hi">${f.hi}°</div>
                <div class="fc-lo">${f.lo}°</div>
              </div>
            </div>
          `).join('')}
        `;
      }
    },
    {
      id: 'message',
      label: 'Custom Message',
      requires: 'message',
      defaultLayout: { x: 7, y: 0, w: 5, h: 2 },
      render: ({ cfg }) => {
        const m = cfg.message;
        if (!m || !m.text) return '';
        return `
          <div class="widget widget-msg">
            <div class="msg-text">${escapeHtml(m.text)}</div>
            ${m.subtitle ? `<div class="msg-sub">${escapeHtml(m.subtitle)}</div>` : ''}
          </div>
        `;
      }
    },
    {
      id: 'todos',
      label: 'To-Do List',
      requires: 'todos',
      defaultLayout: { x: 7, y: 2, w: 5, h: 3 },
      render: ({ todos }) => {
        if (!todos || !todos.length) return '';
        return `
          <div class="widget widget-todos">
            <div class="widget-title">TODO</div>
            <ul class="todo-list">
              ${todos.map(t => `
                <li class="${t.done ? 'done' : ''}">
                  <span class="checkbox"></span>
                  <span class="todo-text">${escapeHtml(t.text)}</span>
                </li>
              `).join('')}
            </ul>
          </div>
        `;
      }
    },
    {
      id: 'calendar',
      label: 'Calendar',
      requires: 'calendar',
      defaultLayout: { x: 7, y: 5, w: 5, h: 1 },
      render: ({ events }) => {
        if (!events || !events.length) return '';
        return `
          <div class="widget widget-cal">
            <div class="widget-title">UPCOMING</div>
            ${events.slice(0,3).map(ev => `
              <div class="cal-row">
                <div class="cal-day">${ev.dayLabel}</div>
                <div class="cal-info">
                  <div class="cal-title">${escapeHtml(ev.title)}</div>
                  <div class="cal-time">${ev.startLabel}</div>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      }
    }
  ];

  function widgetById(id) {
    return WIDGET_REGISTRY.find(w => w.id === id);
  }

  // Build layout array from cfg.
  // - If cfg.layout exists, use it (filling in any missing fields from defaults).
  // - Otherwise auto-fit enabled widgets across the grid so disabled widgets
  //   never leave empty cells.
  function resolveLayout() {
    if (Array.isArray(cfg.layout) && cfg.layout.length) {
      return cfg.layout.map(l => {
        const def = widgetById(l.id);
        if (!def) return null;
        return {
          id: l.id,
          x: Number.isFinite(l.x) ? l.x : def.defaultLayout.x,
          y: Number.isFinite(l.y) ? l.y : def.defaultLayout.y,
          w: Number.isFinite(l.w) ? l.w : def.defaultLayout.w,
          h: Number.isFinite(l.h) ? l.h : def.defaultLayout.h,
          enabled: l.enabled !== false
        };
      }).filter(Boolean);
    }
    return buildAutoLayout();
  }

  // Compute an auto-collapsing layout from the legacy `cfg.widgets` booleans.
  // Splits the body grid into a weather area on the left and a stack of
  // right-column widgets, sizing each region only when its widgets are on.
  function buildAutoLayout() {
    const have = {};
    for (const def of WIDGET_REGISTRY) {
      have[def.id] = !!widgets[def.requires];
    }
    const rightItems = ['message', 'todos', 'calendar'].filter(id => have[id]);
    const haveRight = rightItems.length > 0;
    const haveHero = have.weather_hero;
    const haveFc   = have.weather_forecast;

    const leftCols  = haveRight ? (haveHero || haveFc ? (haveRight ? 7 : 12) : 0) : 12;
    const rightCols = GRID_COLS - leftCols;
    const rightX    = leftCols;

    const layout = [];

    if (haveHero && haveFc) {
      const heroW = Math.max(3, Math.ceil(leftCols * 0.57));
      const fcW   = leftCols - heroW;
      layout.push({ id:'weather_hero',     x:0,     y:0, w:heroW, h:GRID_ROWS, enabled:true });
      layout.push({ id:'weather_forecast', x:heroW, y:0, w:fcW,   h:GRID_ROWS, enabled:true });
    } else if (haveHero) {
      layout.push({ id:'weather_hero', x:0, y:0, w:leftCols, h:GRID_ROWS, enabled:true });
    } else if (haveFc) {
      layout.push({ id:'weather_forecast', x:0, y:0, w:leftCols, h:GRID_ROWS, enabled:true });
    }

    if (haveRight && rightCols > 0) {
      const base = Math.floor(GRID_ROWS / rightItems.length);
      const rem  = GRID_ROWS - base * rightItems.length;
      let y = 0;
      rightItems.forEach((id, i) => {
        const h = base + (i < rem ? 1 : 0);
        layout.push({ id, x: rightX, y, w: rightCols, h, enabled: true });
        y += h;
      });
    }

    return layout;
  }

  const page = document.getElementById('page');

  // ============ HEADER ============
  const cityLabel = (cfg.cityLabel || cfg.city || '').toString();
  const dateStr = w ? w.currentDate : new Date().toDateString().toUpperCase();
  const timeStr = w ? w.currentTime : '';

  // Screen 2 = minimal weather-only layout
  if (screen === 2) {
    renderScreen2();
    return;
  }

  const header = el('header', 'hdr');
  header.innerHTML = `
    <div class="hdr-left">
      <div class="hdr-city">${cityLabel}</div>
      <div class="hdr-date">${dateStr}</div>
    </div>
    <div class="hdr-right">
      <div class="hdr-time">${timeStr}</div>
      <div class="hdr-meta">EDITION No. ${Math.floor(Date.now()/3600000) % 9999}</div>
    </div>
  `;
  page.appendChild(header);

  // ============ MAIN BODY — CSS GRID ============
  const body = el('main', 'body body-grid');
  body.style.gridTemplateColumns = `repeat(${GRID_COLS}, 1fr)`;
  body.style.gridTemplateRows    = `repeat(${GRID_ROWS}, 1fr)`;
  page.appendChild(body);

  const ctx = { cfg, weather: w, events, todos, units };
  const layout = resolveLayout();

  let anyRendered = false;
  for (const item of layout) {
    if (!item.enabled) continue;
    const def = widgetById(item.id);
    if (!def) continue;
    const inner = def.render(ctx);
    if (!inner) continue;
    const edges = [];
    if (item.x + item.w >= GRID_COLS) edges.push('cell-edge-right');
    if (item.y + item.h >= GRID_ROWS) edges.push('cell-edge-bottom');
    const cell = el('div', `cell cell-${item.id} ${edges.join(' ')}`, inner);
    cell.style.gridColumn = `${item.x + 1} / span ${item.w}`;
    cell.style.gridRow    = `${item.y + 1} / span ${item.h}`;
    body.appendChild(cell);
    anyRendered = true;
  }

  if (!anyRendered) {
    const empty = el('div', 'empty terminal-empty', '> NO_WIDGETS_ENABLED');
    empty.style.gridColumn = `1 / span ${GRID_COLS}`;
    empty.style.gridRow    = `1 / span ${GRID_ROWS}`;
    body.appendChild(empty);
  }

  // ============ FOOTER ============
  const footer = el('footer', 'ftr');
  footer.innerHTML = `
    <span class="ftr-bullet">●</span>
    UPDATED ${timeStr || '—'}
    <span class="ftr-sep">·</span>
    REFRESH ${cfg.refreshMinutes || 30}MIN
    <span class="ftr-sep">·</span>
    THE DAILY ${(cityLabel || 'DASHBOARD').split(' ')[0]}
  `;
  page.appendChild(footer);

  function renderScreen2() {
    // Minimal: huge weather hero centered. No forecast/todos/calendar.
    const root = page;
    root.innerHTML = '';
    root.classList.add('page-minimal');

    const top = el('header', 'hdr');
    top.innerHTML = `
      <div class="hdr-left">
        <div class="hdr-city">${cityLabel}</div>
        <div class="hdr-date">${dateStr}</div>
      </div>
      <div class="hdr-right">
        <div class="hdr-time">${timeStr}</div>
        <div class="hdr-meta">SCREEN 2 · MINIMAL</div>
      </div>
    `;
    root.appendChild(top);

    const main = el('main', 'minimal-body');
    if (widgets.weather && w) {
      main.innerHTML = `
        <div class="minimal-icon">${icon(w.main, 220)}</div>
        <div class="minimal-temp"><span>${w.temp}</span><span class="minimal-deg">°${units}</span></div>
        <div class="minimal-desc">${w.desc}</div>
        <div class="minimal-hilo">HIGH ${w.tempMax}° · LOW ${w.tempMin}° · FEELS ${w.feelsLike}°</div>
        ${widgets.message && cfg.message && cfg.message.text
          ? `<div class="minimal-msg">${escapeHtml(cfg.message.text)}</div>` : ''}
      `;
    } else {
      main.innerHTML = `<div class="empty">NO WEATHER</div>`;
    }
    root.appendChild(main);

    const ftr = el('footer', 'ftr');
    ftr.innerHTML = `
      <span class="ftr-bullet">●</span>
      UPDATED ${timeStr || '—'}
      <span class="ftr-sep">·</span>
      REFRESH ${cfg.refreshMinutes || 30}MIN
      <span class="ftr-sep">·</span>
      ${(cityLabel || 'DASHBOARD').split(' ')[0]}
    `;
    root.appendChild(ftr);
  }
})();
</script>
</body>
</html>
