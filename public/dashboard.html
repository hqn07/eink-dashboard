<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>E-Ink Dashboard</title>
<link rel="stylesheet" href="/static/dashboard.css">
<script>/*__DATA__*/</script>
</head>
<body>
<div class="page" id="page">
  <!-- Filled by JS from window.__DASHBOARD__ -->
</div>

<script>
(function() {
  const D = window.__DASHBOARD__ || {};
  const cfg = D.cfg || {};
  const w = D.weather;
  const events = D.events || [];
  const todos = (cfg.todos || []).slice(0, 6);
  const widgets = cfg.widgets || {};
  const units = D.units || cfg.units || 'F';
  const screen = D.screen || cfg.screen || 1;
  document.body.setAttribute('data-screen', String(screen));
  document.body.setAttribute('data-units', units);

  function el(tag, cls, html) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  }

  // Icon SVGs — pure black/white, scale to any size via CSS
  const ICONS = {
    Clear: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="22" fill="#000"/>
      ${Array.from({length:8}, (_,i)=>{
        const a = i*Math.PI/4;
        const x1 = 50 + 30*Math.cos(a), y1 = 50 + 30*Math.sin(a);
        const x2 = 50 + 42*Math.cos(a), y2 = 50 + 42*Math.sin(a);
        return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#000" stroke-width="5" stroke-linecap="round"/>`;
      }).join('')}</svg>`,
    Clouds: `<svg viewBox="0 0 100 100">
      <path d="M 25 65 Q 15 65 15 55 Q 15 45 25 45 Q 25 30 40 30 Q 55 30 58 45 Q 75 45 75 60 Q 75 70 65 70 L 25 70 Z"
        fill="#000"/></svg>`,
    Rain: `<svg viewBox="0 0 100 100">
      <path d="M 25 50 Q 15 50 15 40 Q 15 30 25 30 Q 25 18 40 18 Q 55 18 58 30 Q 75 30 75 45 Q 75 55 65 55 L 25 55 Z"
        fill="#000"/>
      <line x1="30" y1="65" x2="26" y2="80" stroke="#000" stroke-width="4" stroke-linecap="round"/>
      <line x1="50" y1="65" x2="46" y2="80" stroke="#000" stroke-width="4" stroke-linecap="round"/>
      <line x1="70" y1="65" x2="66" y2="80" stroke="#000" stroke-width="4" stroke-linecap="round"/>
    </svg>`,
    Thunderstorm: `<svg viewBox="0 0 100 100">
      <path d="M 25 45 Q 15 45 15 35 Q 15 25 25 25 Q 25 12 40 12 Q 55 12 58 25 Q 75 25 75 40 Q 75 50 65 50 L 25 50 Z"
        fill="#000"/>
      <polygon points="48,55 38,75 48,75 42,90 60,68 50,68 56,55" fill="#000"/>
    </svg>`,
    Snow: `<svg viewBox="0 0 100 100">
      <path d="M 25 45 Q 15 45 15 35 Q 15 25 25 25 Q 25 12 40 12 Q 55 12 58 25 Q 75 25 75 40 Q 75 50 65 50 L 25 50 Z"
        fill="#000"/>
      ${[30,50,70].map(x => `
        <g stroke="#000" stroke-width="3" stroke-linecap="round">
          <line x1="${x-6}" y1="70" x2="${x+6}" y2="70"/>
          <line x1="${x}" y1="64" x2="${x}" y2="76"/>
          <line x1="${x-4}" y1="66" x2="${x+4}" y2="74"/>
          <line x1="${x-4}" y1="74" x2="${x+4}" y2="66"/>
        </g>
      `).join('')}
    </svg>`,
    Mist: `<svg viewBox="0 0 100 100">
      ${[30,45,60,75].map((y,i) => `
        <line x1="${15 + (i%2)*5}" y1="${y}" x2="${85 - (i%2)*5}" y2="${y}"
          stroke="#000" stroke-width="5" stroke-linecap="round"/>
      `).join('')}
    </svg>`
  };
  ICONS.Drizzle = ICONS.Rain;
  ICONS.Fog = ICONS.Mist;
  ICONS.Haze = ICONS.Mist;

  function icon(main, size) {
    const svg = ICONS[main] || ICONS.Clear;
    return `<span class="icon" style="width:${size}px;height:${size}px">${svg}</span>`;
  }

  const page = document.getElementById('page');

  // ============ HEADER ============
  const cityLabel = (cfg.cityLabel || cfg.city || '').toString();
  const dateStr = w ? w.currentDate : new Date().toDateString().toUpperCase();
  const timeStr = w ? w.currentTime : '';

  // Screen 2 = minimal weather-only layout
  if (screen === 2) {
    renderScreen2();
    return;
  }

  const header = el('header', 'hdr');
  header.innerHTML = `
    <div class="hdr-left">
      <div class="hdr-city">${cityLabel}</div>
      <div class="hdr-date">${dateStr}</div>
    </div>
    <div class="hdr-right">
      <div class="hdr-time">${timeStr}</div>
      <div class="hdr-meta">EDITION No. ${Math.floor(Date.now()/3600000) % 9999}</div>
    </div>
  `;
  page.appendChild(header);

  // ============ MAIN BODY ============
  const body = el('main', 'body');
  page.appendChild(body);

  // Left column: weather hero (always visible if weather enabled)
  if (widgets.weather && w) {
    const left = el('section', 'col col-left');
    left.innerHTML = `
      <div class="weather-hero">
        <div class="weather-icon">${icon(w.main, 130)}</div>
        <div class="weather-temp">
          <span class="temp-num">${w.temp}</span><span class="temp-deg">°${units}</span>
        </div>
        <div class="weather-desc">${w.desc}</div>
        <div class="weather-hilo">HIGH ${w.tempMax}° &nbsp;·&nbsp; LOW ${w.tempMin}°</div>
      </div>
      <div class="weather-stats">
        <div class="stat"><span class="stat-k">FEELS</span><span class="stat-v">${w.feelsLike}°</span></div>
        <div class="stat"><span class="stat-k">HUMID</span><span class="stat-v">${w.humidity}%</span></div>
        <div class="stat"><span class="stat-k">WIND</span><span class="stat-v">${w.windDir} ${w.windSpeed} ${w.windUnit || ''}</span></div>
        <div class="stat"><span class="stat-k">RISE</span><span class="stat-v">${w.sunrise}</span></div>
      </div>
    `;
    body.appendChild(left);
  }

  // Middle column: 3-day forecast strip
  if (widgets.weather && w && w.forecast.length) {
    const mid = el('section', 'col col-mid');
    mid.innerHTML = `
      <div class="col-title">3-DAY OUTLOOK</div>
      ${w.forecast.map(f => `
        <div class="fc-row">
          <div class="fc-day">${f.name}</div>
          <div class="fc-icon">${icon(f.main, 38)}</div>
          <div class="fc-hilo">
            <div class="fc-hi">${f.hi}°</div>
            <div class="fc-lo">${f.lo}°</div>
          </div>
        </div>
      `).join('')}
    `;
    body.appendChild(mid);
  }

  // Right column: stacked widgets (message, todos, calendar)
  const right = el('section', 'col col-right');
  let rightHtml = '';

  if (widgets.message && cfg.message && cfg.message.text) {
    rightHtml += `
      <div class="widget widget-msg">
        <div class="msg-text">${escapeHtml(cfg.message.text)}</div>
        ${cfg.message.subtitle ? `<div class="msg-sub">${escapeHtml(cfg.message.subtitle)}</div>` : ''}
      </div>
    `;
  }

  if (widgets.todos && todos.length) {
    rightHtml += `
      <div class="widget widget-todos">
        <div class="widget-title">TODO</div>
        <ul class="todo-list">
          ${todos.map(t => `
            <li class="${t.done ? 'done' : ''}">
              <span class="checkbox"></span>
              <span class="todo-text">${escapeHtml(t.text)}</span>
            </li>
          `).join('')}
        </ul>
      </div>
    `;
  }

  if (widgets.calendar && events.length) {
    rightHtml += `
      <div class="widget widget-cal">
        <div class="widget-title">UPCOMING</div>
        ${events.slice(0,3).map(ev => `
          <div class="cal-row">
            <div class="cal-day">${ev.dayLabel}</div>
            <div class="cal-info">
              <div class="cal-title">${escapeHtml(ev.title)}</div>
              <div class="cal-time">${ev.startLabel}</div>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }

  right.innerHTML = rightHtml || '<div class="empty">NO WIDGETS ENABLED</div>';
  body.appendChild(right);

  // ============ FOOTER ============
  const footer = el('footer', 'ftr');
  footer.innerHTML = `
    <span class="ftr-bullet">●</span>
    UPDATED ${timeStr || '—'}
    <span class="ftr-sep">·</span>
    REFRESH ${cfg.refreshMinutes || 30}MIN
    <span class="ftr-sep">·</span>
    THE DAILY ${(cityLabel || 'DASHBOARD').split(' ')[0]}
  `;
  page.appendChild(footer);

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  function renderScreen2() {
    // Minimal: huge weather hero centered. No forecast/todos/calendar.
    const root = page;
    root.innerHTML = '';
    root.classList.add('page-minimal');

    const top = el('header', 'hdr');
    top.innerHTML = `
      <div class="hdr-left">
        <div class="hdr-city">${cityLabel}</div>
        <div class="hdr-date">${dateStr}</div>
      </div>
      <div class="hdr-right">
        <div class="hdr-time">${timeStr}</div>
        <div class="hdr-meta">SCREEN 2 · MINIMAL</div>
      </div>
    `;
    root.appendChild(top);

    const main = el('main', 'minimal-body');
    if (widgets.weather && w) {
      main.innerHTML = `
        <div class="minimal-icon">${icon(w.main, 220)}</div>
        <div class="minimal-temp"><span>${w.temp}</span><span class="minimal-deg">°${units}</span></div>
        <div class="minimal-desc">${w.desc}</div>
        <div class="minimal-hilo">HIGH ${w.tempMax}° · LOW ${w.tempMin}° · FEELS ${w.feelsLike}°</div>
        ${widgets.message && cfg.message && cfg.message.text
          ? `<div class="minimal-msg">${escapeHtml(cfg.message.text)}</div>` : ''}
      `;
    } else {
      main.innerHTML = `<div class="empty">NO WEATHER</div>`;
    }
    root.appendChild(main);

    const ftr = el('footer', 'ftr');
    ftr.innerHTML = `
      <span class="ftr-bullet">●</span>
      UPDATED ${timeStr || '—'}
      <span class="ftr-sep">·</span>
      REFRESH ${cfg.refreshMinutes || 30}MIN
      <span class="ftr-sep">·</span>
      ${(cityLabel || 'DASHBOARD').split(' ')[0]}
    `;
    root.appendChild(ftr);
  }
})();
</script>
</body>
</html>
