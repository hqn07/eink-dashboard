<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>E-Ink Dashboard</title>
<link rel="stylesheet" href="/static/dashboard.css?v=9">
<script>/*__DATA__*/</script>
</head>
<body>
<div class="page" id="page">
  <!-- Filled by JS from window.__DASHBOARD__ -->
</div>

<script>
(function() {
  const D = window.__DASHBOARD__ || {};
  const cfg = D.cfg || {};
  const w = D.weather;
  const events = D.events || [];
  const todos = (cfg.todos || []).slice(0, 6);
  const widgets = cfg.widgets || {};
  const units = D.units || cfg.units || 'F';
  const screen = D.screen || cfg.screen || 1;
  const aqi = D.aqi || null;
  const news = D.news || [];
  const stocks = D.stocks || [];
  const github = D.github || null;
  const wifiQrSvg = D.wifiQrSvg || null;
  const clockNow = D.clockNow || null;
  const countdowns = D.countdowns || [];
  const moonsun = D.moonsun || null;
  const resolvedQuote = D.resolvedQuote || null;
  const resolvedMessage = D.resolvedMessage || null;
  const chrome = D.chrome || {
    header: { enabled: true, left: '{city}', leftSub: '{date}', right: '{time}', rightSub: 'EDITION No. {edition}' },
    footer: { enabled: true, text: 'UPDATED {time} · REFRESH {refresh}MIN · THE DAILY {city}' }
  };

  // Minimal inline markdown (escaped first).
  function md(s) {
    return String(s || '')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>')
      .replace(/`(.+?)`/g, '<code>$1</code>');
  }

  // Setup-needed placeholder. Used by widgets when required config is
  // unset (e.g. no GitHub username, no photo uploaded). Renders a
  // clearly-marked card so the user notices "this needs config" instead
  // of the widget silently disappearing.
  function placeholder(title, hint) {
    return `
      <div class="widget widget-placeholder">
        <div class="ph-title">${title}</div>
        <div class="ph-hint">${hint}</div>
        <div class="ph-tag">SETUP NEEDED</div>
      </div>
    `;
  }

  // Inject accent color as CSS variable, if set.
  if (cfg.accent) {
    document.documentElement.style.setProperty('--accent', cfg.accent);
  }
  document.body.setAttribute('data-screen', String(screen));
  document.body.setAttribute('data-units', units);

  // ============ GRID CONFIG ============
  const GRID_COLS = 24;
  const GRID_ROWS = 12;

  function el(tag, cls, html) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  // Icon SVGs — pure black/white, scale to any size via CSS
  const ICONS = {
    Clear: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="22" fill="#000"/>
      ${Array.from({length:8}, (_,i)=>{
        const a = i*Math.PI/4;
        const x1 = 50 + 30*Math.cos(a), y1 = 50 + 30*Math.sin(a);
        const x2 = 50 + 42*Math.cos(a), y2 = 50 + 42*Math.sin(a);
        return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#000" stroke-width="5" stroke-linecap="round"/>`;
      }).join('')}</svg>`,
    Clouds: `<svg viewBox="0 0 100 100">
      <path d="M 25 65 Q 15 65 15 55 Q 15 45 25 45 Q 25 30 40 30 Q 55 30 58 45 Q 75 45 75 60 Q 75 70 65 70 L 25 70 Z"
        fill="#000"/></svg>`,
    Rain: `<svg viewBox="0 0 100 100">
      <path d="M 25 50 Q 15 50 15 40 Q 15 30 25 30 Q 25 18 40 18 Q 55 18 58 30 Q 75 30 75 45 Q 75 55 65 55 L 25 55 Z"
        fill="#000"/>
      <line x1="30" y1="65" x2="26" y2="80" stroke="#000" stroke-width="4" stroke-linecap="round"/>
      <line x1="50" y1="65" x2="46" y2="80" stroke="#000" stroke-width="4" stroke-linecap="round"/>
      <line x1="70" y1="65" x2="66" y2="80" stroke="#000" stroke-width="4" stroke-linecap="round"/>
    </svg>`,
    Thunderstorm: `<svg viewBox="0 0 100 100">
      <path d="M 25 45 Q 15 45 15 35 Q 15 25 25 25 Q 25 12 40 12 Q 55 12 58 25 Q 75 25 75 40 Q 75 50 65 50 L 25 50 Z"
        fill="#000"/>
      <polygon points="48,55 38,75 48,75 42,90 60,68 50,68 56,55" fill="#000"/>
    </svg>`,
    Snow: `<svg viewBox="0 0 100 100">
      <path d="M 25 45 Q 15 45 15 35 Q 15 25 25 25 Q 25 12 40 12 Q 55 12 58 25 Q 75 25 75 40 Q 75 50 65 50 L 25 50 Z"
        fill="#000"/>
      ${[30,50,70].map(x => `
        <g stroke="#000" stroke-width="3" stroke-linecap="round">
          <line x1="${x-6}" y1="70" x2="${x+6}" y2="70"/>
          <line x1="${x}" y1="64" x2="${x}" y2="76"/>
          <line x1="${x-4}" y1="66" x2="${x+4}" y2="74"/>
          <line x1="${x-4}" y1="74" x2="${x+4}" y2="66"/>
        </g>
      `).join('')}
    </svg>`,
    Mist: `<svg viewBox="0 0 100 100">
      ${[30,45,60,75].map((y,i) => `
        <line x1="${15 + (i%2)*5}" y1="${y}" x2="${85 - (i%2)*5}" y2="${y}"
          stroke="#000" stroke-width="5" stroke-linecap="round"/>
      `).join('')}
    </svg>`
  };
  ICONS.Drizzle = ICONS.Rain;
  ICONS.Fog = ICONS.Mist;
  ICONS.Haze = ICONS.Mist;

  function icon(main, size) {
    const svg = ICONS[main] || ICONS.Clear;
    return `<span class="icon" style="width:${size}px;height:${size}px">${svg}</span>`;
  }

  // Day-progress bar between sunrise and sunset. Renders nothing if the
  // weather payload lacks the parsed minute timestamps.
  function sunBar(w) {
    if (!w || !Number.isFinite(w.sunriseMin) || !Number.isFinite(w.sunsetMin)) return '';
    const sr = w.sunriseMin, ss = w.sunsetMin;
    const nowM = Number.isFinite(w.nowMin) ? w.nowMin : sr;
    let pct;
    if (nowM < sr) pct = 0;
    else if (nowM > ss) pct = 100;
    else pct = ((nowM - sr) / (ss - sr)) * 100;
    return `
      <div class="sun-bar">
        <div class="sun-track">
          <div class="sun-fill" style="width:${pct.toFixed(1)}%"></div>
          <div class="sun-dot" style="left:${pct.toFixed(1)}%"></div>
        </div>
        <div class="sun-labels">
          <span>↑ ${w.sunrise}</span>
          <span>↓ ${w.sunset}</span>
        </div>
      </div>
    `;
  }

  function hourlyStrip(w) {
    if (!w || !Array.isArray(w.hourly) || !w.hourly.length) return '';
    // Threshold: only render the pill at >=10% chance — anything below
    // is visual noise on a 1-bit panel + read as battery / unrelated UI.
    return `
      <div class="hourly-strip">
        ${w.hourly.map(h => `
          <div class="hr-cell">
            <div class="hr-time">${h.label}</div>
            ${icon(h.main, 22)}
            <div class="hr-temp">${h.temp}°</div>
            ${Number.isFinite(h.precip) && h.precip >= 10
              ? `<div class="hr-precip-pct">${h.precip}%</div>`
              : ''}
          </div>
        `).join('')}
      </div>
    `;
  }

  function alertBanner(w) {
    if (!w || !Array.isArray(w.alerts) || !w.alerts.length) return '';
    const a = w.alerts[0];
    return `
      <div class="weather-alert">
        <span class="alert-tag">⚠ ${a.severity || 'ALERT'}</span>
        <span class="alert-text">${a.event}</span>
      </div>
    `;
  }

  // ============ WIDGET REGISTRY ============
  // Each widget: { id, label, requires, sizes, defaultSize, render(ctx) }
  // The dashboard renderer is data-only; w/h come from the saved layout
  // (the editor picks them from `sizes` presets).
  const WIDGET_REGISTRY = [
    {
      id: 'weather_hero',
      label: 'Weather (current)',
      requires: 'weather',
      sizes: { XS:{w:8,h:4}, S:{w:8,h:6}, M:{w:8,h:12}, L:{w:12,h:12}, XL:{w:24,h:12} },
      defaultSize: 'M',
      render: ({ weather, units, cellW, cellH, cfg }) => {
        if (!weather) {
          if (!Number.isFinite(cfg.lat) || !Number.isFinite(cfg.lon)) {
            return placeholder('WEATHER', 'Set your location in settings');
          }
          return placeholder('WEATHER', 'Data unavailable');
        }
        const h = cellH || 0, w = cellW || 0;
        const staleClass = weather.stale ? ' weather-stale' : '';
        const staleBadge = weather.stale ? '<div class="stale-pill">CACHED</div>' : '';

        // Tiered layouts: progressively reveal info as the cell grows.
        // h < 4   : just temp + small icon
        // h 4-5   : + description + hi/lo
        // h 6-7   : + stats grid
        // h 8-11  : + alert banner
        // h >= 12 : + sun bar + hourly strip
        const showDesc   = h >= 4;
        const showStats  = h >= 6;
        const showAlert  = h >= 6;
        const showExtras = h >= 12 && w >= 12;
        const iconSize   = h < 4 ? 60 : h < 8 ? 100 : 130;

        const hero = `
          <div class="weather-hero${staleClass}">
            ${staleBadge}
            <div class="weather-icon">${icon(weather.main, iconSize)}</div>
            <div class="weather-temp">
              <span class="temp-num">${weather.temp}</span><span class="temp-deg">°${units}</span>
            </div>
            ${showDesc ? `
              <div class="weather-desc">${weather.desc}</div>
              <div class="weather-hilo">HIGH ${weather.tempMax}° &nbsp;·&nbsp; LOW ${weather.tempMin}°</div>
            ` : ''}
          </div>`;
        const stats = showStats ? `
          <div class="weather-stats">
            <div class="stat"><span class="stat-k">FEELS</span><span class="stat-v">${weather.feelsLike}°</span></div>
            <div class="stat"><span class="stat-k">HUMID</span><span class="stat-v">${weather.humidity}%</span></div>
            <div class="stat"><span class="stat-k">WIND</span><span class="stat-v">${weather.windDir} ${weather.windSpeed}${weather.windGust ? ` (G${weather.windGust})` : ''} ${weather.windUnit || ''}</span></div>
            <div class="stat"><span class="stat-k">${Number.isFinite(weather.cloudCover) ? 'CLOUD' : 'RISE'}</span><span class="stat-v">${Number.isFinite(weather.cloudCover) ? weather.cloudCover + '%' : weather.sunrise}</span></div>
          </div>` : '';
        const extras = showExtras ? `${sunBar(weather)}${hourlyStrip(weather)}` : '';
        const alert  = showAlert ? alertBanner(weather) : '';
        return `${hero}${alert}${stats}${extras}`;
      }
    },
    {
      id: 'weather_forecast',
      label: 'Weather Forecast',
      requires: 'weather',
      sizes: { S:{w:6,h:8}, M:{w:6,h:12}, L:{w:12,h:12}, XL:{w:24,h:6} },
      defaultSize: 'M',
      render: ({ weather, cellH, cfg }) => {
        if (!weather || !weather.forecast || !weather.forecast.length) {
          if (!Number.isFinite(cfg.lat) || !Number.isFinite(cfg.lon)) {
            return placeholder('FORECAST', 'Set your location in settings');
          }
          return placeholder('FORECAST', 'Data unavailable');
        }
        // Number of days to render scales with vertical space.
        // Cap at 5 even at h=6 so SAT doesn't clip in a 392/452px cell.
        const max = (cellH || 0) >= 12 ? 5 : 3;
        const list = weather.forecast.slice(0, max);
        return `
          <div class="col-title">${list.length}-DAY OUTLOOK</div>
          ${list.map(f => `
            <div class="fc-row">
              <div class="fc-day">${f.name}</div>
              <div class="fc-icon">${icon(f.main, 38)}</div>
              <div class="fc-hilo">
                <div class="fc-hi">${f.hi}°</div>
                <div class="fc-lo">${f.lo}°</div>
              </div>
              ${Number.isFinite(f.precip) && f.precip > 0
                ? `<div class="fc-precip">${f.precip}%</div>` : '<div class="fc-precip"></div>'}
            </div>
          `).join('')}
        `;
      }
    },
    {
      id: 'message',
      label: 'Custom Message',
      requires: 'message',
      sizes: { XS:{w:8,h:3}, S:{w:8,h:4}, M:{w:10,h:4}, L:{w:24,h:4}, XL:{w:24,h:6} },
      defaultSize: 'M',
      render: ({ cfg, resolvedMessage, cellH }) => {
        const m = resolvedMessage || cfg.message;
        if (!m || !m.text) return placeholder('MESSAGE', 'Set a headline in settings');
        const ch = cellH || 0;
        // Smaller cells suppress subtitle, scale the headline down.
        const showSub = ch >= 3;
        const txtSize = ch < 3 ? 14 : ch < 5 ? 18 : ch < 8 ? 22 : 28;
        return `
          <div class="widget widget-msg">
            <div class="msg-text" style="font-size:${txtSize}px">${md(escapeHtml(m.text))}</div>
            ${showSub && m.subtitle ? `<div class="msg-sub">${md(escapeHtml(m.subtitle))}</div>` : ''}
          </div>
        `;
      }
    },
    {
      id: 'todos',
      label: 'To-Do List',
      requires: 'todos',
      sizes: { S:{w:8,h:6}, M:{w:10,h:6}, L:{w:12,h:12}, XL:{w:24,h:12} },
      defaultSize: 'M',
      render: ({ todos, cellH }) => {
        if (!todos || !todos.length) return placeholder('TODO', 'Add items in settings');
        const today = (() => {
          const d = new Date();
          return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        })();
        const ch = cellH || 0;
        // Tier: shorter cells → fewer items, no due-date pills.
        const maxItems = ch < 4 ? 2 : ch < 6 ? 4 : ch < 12 ? 6 : 10;
        const showDue  = ch >= 4;
        const showRecur = ch >= 4;
        const list = todos.slice(0, maxItems);
        return `
          <div class="widget widget-todos">
            <div class="widget-title">TODO</div>
            <ul class="todo-list">
              ${list.map(t => {
                const overdue = t.dueDate && !t.done && t.dueDate < today;
                const due = showDue && t.dueDate && !t.done
                  ? `<span class="todo-due ${overdue ? 'overdue' : ''}">${t.dueDate === today ? 'TODAY' : (overdue ? 'LATE' : t.dueDate.slice(5))}</span>`
                  : '';
                const recur = showRecur && t.recurring === 'daily' ? '<span class="todo-recur">↻</span>' : '';
                return `
                  <li class="${t.done ? 'done' : ''}">
                    <span class="checkbox">${t.done ? '✓' : ''}</span>
                    <span class="todo-text">${escapeHtml(t.text)}</span>
                    ${recur}
                    ${due}
                  </li>
                `;
              }).join('')}
            </ul>
          </div>
        `;
      }
    },
    {
      id: 'calendar',
      label: 'Calendar',
      requires: 'calendar',
      sizes: { S:{w:8,h:4}, M:{w:10,h:4}, L:{w:24,h:4}, XL:{w:24,h:8} },
      defaultSize: 'M',
      render: ({ events, cfg, cellH }) => {
        const urls = (cfg.calendar && Array.isArray(cfg.calendar.icalUrls) && cfg.calendar.icalUrls.filter(Boolean).length)
          ? cfg.calendar.icalUrls.filter(Boolean)
          : (cfg.calendar && cfg.calendar.icalUrl ? [cfg.calendar.icalUrl] : []);
        if (!urls.length) return placeholder('UPCOMING', 'Paste an iCal URL in settings');
        if (!events || !events.length) return placeholder('UPCOMING', 'No events in the next 14 days');
        const ch = cellH || 0;
        const maxEvents  = ch < 4 ? 2 : ch < 6 ? 4 : ch < 12 ? 6 : 10;
        const showSections = ch >= 6;
        const slice = events.slice(0, maxEvents);
        if (!showSections) {
          return `
            <div class="widget widget-cal">
              <div class="widget-title">UPCOMING</div>
              ${slice.map(ev => `
                <div class="cal-row ${ev.isAllDay ? 'allday' : ''}">
                  <div class="cal-day">${ev.dayLabel}</div>
                  <div class="cal-info">
                    <div class="cal-title">${escapeHtml(ev.title)}</div>
                    <div class="cal-time">${ev.startLabel}</div>
                  </div>
                </div>
              `).join('')}
            </div>
          `;
        }
        const groups = {};
        const order = [];
        for (const ev of slice) {
          const s = ev.section || 'LATER';
          if (!groups[s]) { groups[s] = []; order.push(s); }
          groups[s].push(ev);
        }
        return `
          <div class="widget widget-cal">
            <div class="widget-title">UPCOMING</div>
            ${order.map(s => `
              <div class="cal-section-title">${s}</div>
              ${groups[s].map(ev => `
                <div class="cal-row ${ev.isAllDay ? 'allday' : ''}">
                  <div class="cal-day">${ev.dayLabel}</div>
                  <div class="cal-info">
                    <div class="cal-title">${escapeHtml(ev.title)}</div>
                    <div class="cal-time">${ev.startLabel}</div>
                  </div>
                </div>
              `).join('')}
            `).join('')}
          </div>
        `;
      }
    },
    {
      id: 'spacer',
      label: 'Black Bar',
      requires: 'spacer',
      sizes: { XS:{w:24,h:1}, S:{w:24,h:2}, M:{w:12,h:2}, L:{w:8,h:12}, XL:{w:24,h:4} },
      defaultSize: 'S',
      render: ({ cfg }) => {
        const s = cfg.spacer || {};
        const text = (s.text || '').trim();
        const invertCls = s.invert ? ' invert' : '';
        return `<div class="widget widget-spacer${invertCls}">${text ? escapeHtml(text) : ''}</div>`;
      }
    },
    {
      id: 'quote',
      label: 'Text / Quote',
      requires: 'quote',
      sizes: { S:{w:8,h:4}, M:{w:12,h:6}, L:{w:24,h:6}, XL:{w:24,h:12} },
      defaultSize: 'M',
      render: ({ cfg, resolvedQuote, cellH, cellW }) => {
        const q = resolvedQuote || cfg.quote || {};
        const body = (q.text || '').trim();
        if (!body) return placeholder('QUOTE', 'Add text or switch source in settings');
        const attr = (q.attribution || '').trim();
        const align = (q.align === 'left' || q.align === 'right') ? q.align : 'center';
        // Font scales by both cell area AND text length so the quote
        // fills the cell without overflowing.
        const ch = cellH || 0;
        const cw = cellW || 0;
        const lengthBase = Math.max(14, Math.min(54, Math.round(560 / Math.max(8, body.length / 4))));
        const cellCap = ch < 3 ? 14 : ch < 5 ? 22 : ch < 8 ? 32 : ch < 12 ? 42 : 56;
        const widthCap = cw < 10 ? 18 : cw < 16 ? 30 : 60;
        const finalSize = Math.min(lengthBase, cellCap, widthCap);
        const showAttr = attr && ch >= 4;
        return `
          <div class="widget widget-quote" style="text-align:${align}">
            <div class="quote-body" style="font-size:${finalSize}px">${md(escapeHtml(body))}</div>
            ${showAttr ? `<div class="quote-attr">— ${escapeHtml(attr)}</div>` : ''}
          </div>
        `;
      }
    },
    {
      id: 'clock',
      label: 'Clock',
      requires: 'clock',
      sizes: { XS:{w:8,h:3}, S:{w:8,h:4}, M:{w:12,h:4}, L:{w:24,h:4}, XL:{w:24,h:6} },
      defaultSize: 'M',
      render: ({ cfg, clockNow, cellH, cellW }) => {
        const c = cfg.clock || {};
        const t = clockNow || { hour: 0, minute: 0, dateLabel: '' };
        let h = t.hour;
        const fmt = c.format === 24 ? 24 : 12;
        const ampm = h >= 12 ? 'PM' : 'AM';
        if (fmt === 12) { h = h % 12; if (h === 0) h = 12; }
        const hh = fmt === 24 ? String(h).padStart(2, '0') : String(h);
        const mm = String(t.minute).padStart(2, '0');
        const suffix = fmt === 12 ? ` ${ampm}` : '';
        // Tiered font sizing — fills the cell at any height.
        const ch = cellH || 0;
        const cw = cellW || 0;
        const timeSize = ch < 4 ? 38 : ch < 5 ? 54 : ch < 7 ? 72 : 96;
        const showDate = c.showDate !== false && ch >= 4 && cw >= 10;
        return `
          <div class="widget widget-clock">
            <div class="clock-time" style="font-size:${timeSize}px">${hh}:${mm}<span class="clock-ampm">${suffix}</span></div>
            ${showDate ? `<div class="clock-date">${t.dateLabel}</div>` : ''}
          </div>
        `;
      }
    },
    {
      id: 'wifi_qr',
      label: 'WiFi QR Code',
      requires: 'wifi',
      sizes: { S:{w:6,h:6}, M:{w:8,h:8}, L:{w:12,h:12} },
      defaultSize: 'M',
      render: ({ cfg, wifiQrSvg, cellH, cellW }) => {
        const w = cfg.wifi || {};
        if (!w.ssid) return placeholder('WIFI QR', 'Enter WiFi SSID + password in settings');
        if (!wifiQrSvg) return placeholder('WIFI QR', 'QR generator not available');
        // Below ~6 rows the meta column gets too cramped — show QR only.
        const ch = cellH || 0, cw = cellW || 0;
        const showMeta = ch >= 6 && cw >= 8;
        return `
          <div class="widget widget-wifi" style="${showMeta ? '' : 'justify-content:center'}">
            <div class="wifi-qr">${wifiQrSvg}</div>
            ${showMeta ? `
              <div class="wifi-meta">
                <div class="wifi-ssid">${escapeHtml(w.ssid)}</div>
                <div class="wifi-hint">SCAN TO CONNECT</div>
              </div>
            ` : ''}
          </div>
        `;
      }
    },
    {
      id: 'countdown',
      label: 'Countdown',
      requires: 'countdowns',
      sizes: { S:{w:8,h:4}, M:{w:12,h:4}, L:{w:24,h:4} },
      defaultSize: 'M',
      render: ({ countdowns, cellH }) => {
        if (!countdowns || !countdowns.length) return placeholder('COUNTDOWN', 'Add a label + date in settings');
        const ch = cellH || 0;
        const maxRows = ch < 4 ? 1 : ch < 8 ? 3 : 5;
        const numSize = ch < 4 ? 28 : ch < 6 ? 36 : ch < 9 ? 44 : 56;
        return `
          <div class="widget widget-countdown">
            ${countdowns.slice(0, maxRows).map(c => `
              <div class="cd-row">
                <div class="cd-num" style="font-size:${numSize}px">${c.days}</div>
                <div class="cd-meta">
                  <div class="cd-unit">${c.unit}</div>
                  <div class="cd-label">${escapeHtml(c.label)}</div>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      }
    },
    {
      id: 'aqi',
      label: 'Air Quality',
      requires: 'aqi',
      sizes: { S:{w:8,h:4}, M:{w:8,h:6}, L:{w:12,h:6} },
      defaultSize: 'M',
      render: ({ aqi, cfg, cellH }) => {
        if (!aqi) {
          if (!Number.isFinite(cfg.lat) || !Number.isFinite(cfg.lon)) {
            return placeholder('AIR QUALITY', 'Set your location in settings');
          }
          return placeholder('AIR QUALITY', 'Data unavailable for this location');
        }
        const ch = cellH || 0;
        const showStats = ch >= 6;
        const numSize = ch < 4 ? 36 : ch < 6 ? 48 : 56;
        return `
          <div class="widget widget-aqi">
            <div class="widget-title">AIR QUALITY</div>
            <div class="aqi-num" style="font-size:${numSize}px">${aqi.aqi}</div>
            <div class="aqi-cat">${aqi.category}</div>
            ${showStats ? `
              <div class="aqi-stats">
                <div class="stat"><span class="stat-k">PM2.5</span><span class="stat-v">${aqi.pm25 ?? '--'}</span></div>
                <div class="stat"><span class="stat-k">PM10</span><span class="stat-v">${aqi.pm10 ?? '--'}</span></div>
                <div class="stat"><span class="stat-k">O₃</span><span class="stat-v">${aqi.o3 ?? '--'}</span></div>
              </div>
            ` : ''}
          </div>
        `;
      }
    },
    {
      id: 'moonsun',
      label: 'Moon & Sun',
      requires: 'moonsun',
      sizes: { S:{w:8,h:4}, M:{w:8,h:6}, L:{w:12,h:6} },
      defaultSize: 'M',
      render: ({ moonsun, cfg, cellH }) => {
        if (!moonsun) {
          if (!Number.isFinite(cfg.lat) || !Number.isFinite(cfg.lon)) {
            return placeholder('MOON & SUN', 'Set your location in settings');
          }
          return placeholder('MOON & SUN', 'Data unavailable');
        }
        const ch = cellH || 0;
        const showSunRow = ch >= 5;
        return `
          <div class="widget widget-moonsun">
            <div class="widget-title">SKY</div>
            <div class="moon-row">
              <div class="moon-disc">${moonsun.moonSvg}</div>
              <div class="moon-meta">
                <div class="moon-phase">${moonsun.phase}</div>
                <div class="moon-illum">${moonsun.illuminationPct}% lit</div>
              </div>
            </div>
            ${showSunRow ? `<div class="sun-row">
              <span>↑ ${moonsun.sunrise}</span>
              <span>↓ ${moonsun.sunset}</span>
            </div>` : ''}
          </div>
        `;
      }
    },
    {
      id: 'news',
      label: 'News Headlines',
      requires: 'news',
      sizes: { S:{w:12,h:6}, M:{w:12,h:12}, L:{w:24,h:12} },
      defaultSize: 'M',
      render: ({ news, cfg, cellH }) => {
        if (!cfg.news || !cfg.news.feedUrl) {
          return placeholder('NEWS HEADLINES', 'Paste an RSS or Atom feed URL in settings');
        }
        if (!news || !news.length) return placeholder('NEWS HEADLINES', 'Feed returned no items');
        const ch = cellH || 0;
        const maxItems = ch < 6 ? 2 : ch < 12 ? 3 : 5;
        const showSource = ch >= 6;
        return `
          <div class="widget widget-news">
            <div class="widget-title">HEADLINES</div>
            <ul class="news-list">
              ${news.slice(0, maxItems).map(n => `
                <li>
                  <div class="news-title">${escapeHtml(n.title)}</div>
                  ${showSource && n.source ? `<div class="news-source">${escapeHtml(n.source)}</div>` : ''}
                </li>
              `).join('')}
            </ul>
          </div>
        `;
      }
    },
    {
      id: 'stocks',
      label: 'Stocks / Crypto',
      requires: 'stocks',
      sizes: { S:{w:8,h:4}, M:{w:12,h:6}, L:{w:24,h:6} },
      defaultSize: 'M',
      render: ({ stocks, cfg, cellH }) => {
        const syms = (cfg.stocks && cfg.stocks.symbols) || [];
        if (!syms.length) return placeholder('MARKETS', 'Add symbols (AAPL, BTC-USD) in settings');
        if (!stocks || !stocks.length) return placeholder('MARKETS', 'Data unavailable — check symbols');
        const ch = cellH || 0;
        const maxRows = ch < 4 ? 2 : ch < 6 ? 4 : 8;
        const showChg = ch >= 4;
        return `
          <div class="widget widget-stocks">
            <div class="widget-title">MARKETS</div>
            <div class="stock-rows">
              ${stocks.slice(0, maxRows).map(s => `
                <div class="stock-row">
                  <span class="stock-sym">${escapeHtml(s.symbol)}</span>
                  <span class="stock-price">${s.price}</span>
                  ${showChg ? `<span class="stock-chg ${s.change >= 0 ? 'up' : 'down'}">${s.change >= 0 ? '▲' : '▼'} ${Math.abs(s.changePct).toFixed(2)}%</span>` : ''}
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }
    },
    {
      id: 'photo',
      label: 'Photo / Image',
      requires: 'photo',
      sizes: { S:{w:8,h:6}, M:{w:12,h:12}, L:{w:24,h:12} },
      defaultSize: 'M',
      render: ({ cfg }) => {
        const p = cfg.photo || {};
        if (!p.dataUrl) return placeholder('PHOTO', 'Upload an image in settings');
        const fit = p.fit === 'cover' ? 'cover' : 'contain';
        return `
          <div class="widget widget-photo">
            <img src="${escapeHtml(p.dataUrl)}" style="object-fit:${fit}" alt="" />
          </div>
        `;
      }
    },
    {
      id: 'github',
      label: 'GitHub Activity',
      requires: 'github',
      sizes: { S:{w:12,h:4}, M:{w:24,h:4}, L:{w:24,h:6} },
      defaultSize: 'M',
      render: ({ github, cfg, cellH, cellW }) => {
        if (!cfg.github || !cfg.github.user) {
          return placeholder('GITHUB', 'Enter a GitHub username in settings');
        }
        if (!github || !github.weeks || !github.weeks.length) {
          return placeholder('GITHUB', 'Data unavailable for ' + escapeHtml(cfg.github.user));
        }
        const ch = cellH || 0;
        const showTitle = ch >= 3;
        const titleText = ch < 5
          ? `${escapeHtml(github.user)} · ${github.total}`
          : `GITHUB · ${escapeHtml(github.user)} · ${github.total} CONTRIBUTIONS`;
        return `
          <div class="widget widget-github">
            ${showTitle ? `<div class="widget-title">${titleText}</div>` : ''}
            <div class="gh-grid">
              ${github.weeks.map(week => `
                <div class="gh-col">
                  ${week.map(d => `<div class="gh-cell" data-l="${d}"></div>`).join('')}
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }
    }
  ];

  function widgetById(id) {
    return WIDGET_REGISTRY.find(w => w.id === id);
  }

  // Per-screen defaults — match control-src/widgets.js.
  const DEFAULT_LAYOUTS = {
    1: [
      { id:'weather_hero',     x:0,  y:0, size:'M', enabled:true },
      { id:'weather_forecast', x:8,  y:0, size:'M', enabled:true },
      { id:'message',          x:14, y:0, size:'M', enabled:true },
      { id:'todos',            x:14, y:4, size:'M', enabled:true },
      { id:'calendar',         x:14, y:8, size:'M', enabled:false },
      { id:'spacer',           x:0, y:0, size:'S', enabled:false },
      { id:'quote',            x:0, y:0, size:'M', enabled:false }
    ],
    2: [
      { id:'weather_hero',     x:0, y:0, size:'XL', enabled:true },
      { id:'weather_forecast', x:0, y:0, size:'M',  enabled:false },
      { id:'message',          x:0, y:0, size:'M',  enabled:false },
      { id:'todos',            x:0, y:0, size:'M',  enabled:false },
      { id:'calendar',         x:0, y:0, size:'M',  enabled:false },
      { id:'spacer',           x:0, y:0, size:'S',  enabled:false },
      { id:'quote',            x:0, y:0, size:'M',  enabled:false }
    ]
  };

  function sizeFor(def, sizeKey) {
    const k = sizeKey && def.sizes[sizeKey] ? sizeKey : def.defaultSize;
    return { size: k, ...def.sizes[k] };
  }

  // Resolve a raw saved layout array into one with explicit w/h. Stored
  // geometry wins; size preset is the fallback.
  function expandLayout(rawLayout) {
    const items = [];
    for (const raw of (rawLayout || [])) {
      if (raw.enabled === false) continue; // legacy: disabled = not rendered
      const widgetId = raw.widgetId || raw.id;
      const def = widgetById(widgetId);
      if (!def) continue;
      const sz = sizeFor(def, raw.size);
      items.push({
        id: raw.id || widgetId,
        widgetId,
        x: Number.isFinite(raw.x) ? raw.x : 0,
        y: Number.isFinite(raw.y) ? raw.y : 0,
        w: Number.isFinite(raw.w) ? raw.w : sz.w,
        h: Number.isFinite(raw.h) ? raw.h : sz.h,
        flush: !!raw.flush
      });
    }
    return items;
  }

  // Resolve which layout to render. Order of precedence:
  //  1. D.layout (server-supplied — new screens schema)
  //  2. cfg.layouts[screen]               — legacy per-screen map
  //  3. cfg.layout                        — legacy single layout
  //  4. cfg.widgets booleans              — oldest config shape
  //  5. DEFAULT_LAYOUTS[1]                — final fallback
  function resolveLayout() {
    if (Array.isArray(D.layout) && D.layout.length) return expandLayout(D.layout);
    const s = (screen === 2) ? 2 : 1;
    if (cfg.layouts && Array.isArray(cfg.layouts[s]) && cfg.layouts[s].length) {
      return expandLayout(cfg.layouts[s]);
    }
    if (Array.isArray(cfg.layout) && cfg.layout.length) {
      return expandLayout(cfg.layout);
    }
    if (cfg.widgets && Object.keys(cfg.widgets).length) {
      const base = DEFAULT_LAYOUTS[s].map(d => {
        const def = widgetById(d.id);
        return { ...d, enabled: !!widgets[def?.requires] };
      });
      return expandLayout(base);
    }
    return expandLayout(DEFAULT_LAYOUTS[s]);
  }

  const page = document.getElementById('page');

  // ============ HEADER ============
  const cityLabel = (cfg.cityLabel || cfg.city || '').toString();

  // Header time/date must reflect REAL clock, not weather observation time
  // (weather is cached 10min and `cur.time` only updates hourly upstream).
  const tz = cfg.timezone || 'UTC';
  const now = new Date();
  let timeStr = '';
  let dateStr = '';
  try {
    timeStr = new Intl.DateTimeFormat('en-US', {
      timeZone: tz, hour: 'numeric', minute: '2-digit', hour12: true
    }).format(now).toUpperCase();
    dateStr = new Intl.DateTimeFormat('en-US', {
      timeZone: tz, weekday: 'short', month: 'short', day: 'numeric', year: 'numeric'
    }).format(now).toUpperCase();
  } catch {
    timeStr = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    dateStr = now.toDateString().toUpperCase();
  }

  // Token substitution for header/footer chrome.
  const editionNo = Math.floor(Date.now() / 3600000) % 9999;
  const tokens = {
    '{city}': cityLabel || '',
    '{time}': timeStr || '',
    '{date}': dateStr || '',
    '{refresh}': String(cfg.refreshMinutes || 30),
    '{edition}': String(editionNo)
  };
  function tpl(s) {
    let out = String(s || '');
    for (const k in tokens) out = out.split(k).join(tokens[k]);
    return out;
  }

  // Page grid rows depend on which chrome bars are enabled.
  // minmax(0, 1fr) prevents body content from pushing the page taller.
  const headerOn = chrome.header && chrome.header.enabled !== false;
  const footerOn = chrome.footer && chrome.footer.enabled !== false;
  const headerRow = headerOn ? '60px' : '0px';
  const footerRow = footerOn ? '28px' : '0px';
  page.style.gridTemplateRows = `${headerRow} minmax(0, 1fr) ${footerRow}`;

  if (headerOn) {
    const h = chrome.header || {};
    const header = el('header', 'hdr');
    header.innerHTML = `
      <div class="hdr-left">
        <div class="hdr-city">${tpl(h.left)}</div>
        ${h.leftSub ? `<div class="hdr-date">${tpl(h.leftSub)}</div>` : ''}
      </div>
      <div class="hdr-right">
        <div class="hdr-time">${tpl(h.right)}</div>
        ${h.rightSub ? `<div class="hdr-meta">${tpl(h.rightSub)}</div>` : ''}
      </div>
    `;
    page.appendChild(header);
  } else {
    // CSS grid still expects a row 1 child — render a zero-height stub.
    page.appendChild(el('div', 'hdr-stub'));
  }

  // ============ MAIN BODY — CSS GRID ============
  // minmax(0, 1fr) prevents wide cell content from pushing the column
  // wider than its share (default 1fr = minmax(auto, 1fr) lets content
  // overflow the page horizontally).
  const body = el('main', 'body body-grid');
  body.style.gridTemplateColumns = `repeat(${GRID_COLS}, minmax(0, 1fr))`;
  body.style.gridTemplateRows    = `repeat(${GRID_ROWS}, minmax(0, 1fr))`;
  page.appendChild(body);

  const ctx = {
    cfg, weather: w, events, todos, units,
    aqi, news, stocks, github, wifiQrSvg, clockNow, countdowns, moonsun,
    resolvedQuote, resolvedMessage,
    chrome, headerOn, footerOn
  };
  const layout = resolveLayout();

  // Compute the wall-clock minute-of-day for visibility gating.
  function nowMinsTZ(tz) {
    try {
      const parts = new Intl.DateTimeFormat('en-US', {
        timeZone: tz || 'UTC', hour12: false, hour: '2-digit', minute: '2-digit'
      }).formatToParts(new Date());
      let h = 0, m = 0;
      for (const p of parts) {
        if (p.type === 'hour') h = parseInt(p.value, 10) % 24;
        if (p.type === 'minute') m = parseInt(p.value, 10);
      }
      return h * 60 + m;
    } catch { return new Date().getHours() * 60 + new Date().getMinutes(); }
  }
  function parseHHMM(s) {
    const m = String(s || '').match(/^(\d{1,2}):(\d{2})$/);
    if (!m) return null;
    return parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
  }
  function withinVisibility(vis, nowM) {
    if (!vis || !vis.enabled) return true;
    const a = parseHHMM(vis.from), b = parseHHMM(vis.to);
    if (a == null || b == null) return true;
    if (a === b) return true;
    if (a < b) return nowM >= a && nowM < b;
    return nowM >= a || nowM < b; // wraps midnight
  }
  const nowM = nowMinsTZ(cfg.timezone || 'UTC');

  let anyRendered = false;
  for (const item of layout) {
    const def = widgetById(item.widgetId || item.id);
    if (!def) continue;
    if (!withinVisibility(item.visibility, nowM)) continue;
    const itemCtx = { ...ctx, cellW: item.w, cellH: item.h };
    const inner = def.render(itemCtx);
    if (!inner) continue;
    const classes = ['cell', `cell-${def.id}`];
    if (item.x + item.w >= GRID_COLS) classes.push('cell-edge-right');
    if (item.y + item.h >= GRID_ROWS) classes.push('cell-edge-bottom');
    if (item.flush) classes.push('cell-flush');
    if (item.border === 'dashed') classes.push('cell-border-dashed');
    if (item.border === 'none')   classes.push('cell-border-none');
    const cell = el('div', classes.join(' '), inner);
    cell.style.gridColumn = `${item.x + 1} / span ${item.w}`;
    cell.style.gridRow    = `${item.y + 1} / span ${item.h}`;
    body.appendChild(cell);
    anyRendered = true;
  }

  if (!anyRendered) {
    const empty = el('div', 'empty terminal-empty', '> NO_WIDGETS_ENABLED');
    empty.style.gridColumn = `1 / span ${GRID_COLS}`;
    empty.style.gridRow    = `1 / span ${GRID_ROWS}`;
    body.appendChild(empty);
  }

  // ============ FOOTER ============
  if (footerOn) {
    const f = chrome.footer || {};
    const footer = el('footer', 'ftr');
    // Render with a leading bullet so the editorial rhythm is preserved
    // even when the user customizes the text.
    footer.innerHTML = `<span class="ftr-bullet">●</span> ${tpl(f.text)}`;
    page.appendChild(footer);
  } else {
    page.appendChild(el('div', 'ftr-stub'));
  }

})();
</script>
</body>
</html>
