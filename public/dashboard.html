<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>E-Ink Dashboard</title>
<link rel="stylesheet" href="/static/dashboard.css?v=9">
<script>/*__DATA__*/</script>
</head>
<body>
<div class="page" id="page">
  <!-- Filled by JS from window.__DASHBOARD__ -->
</div>

<script>
(function() {
  const D = window.__DASHBOARD__ || {};
  const cfg = D.cfg || {};
  const w = D.weather;
  const events = D.events || [];
  const todos = (cfg.todos || []).slice(0, 6);
  const widgets = cfg.widgets || {};
  const units = D.units || cfg.units || 'F';
  const screen = D.screen || cfg.screen || 1;
  const aqi = D.aqi || null;
  const news = D.news || [];
  const stocks = D.stocks || [];
  const github = D.github || null;
  const wifiQrSvg = D.wifiQrSvg || null;
  const clockNow = D.clockNow || null;
  const countdowns = D.countdowns || [];
  const moonsun = D.moonsun || null;
  const resolvedQuote = D.resolvedQuote || null;
  const resolvedMessage = D.resolvedMessage || null;
  const resolvedPhoto = D.resolvedPhoto || null;
  const counters = D.counters || [];
  const linkQrSvg = D.linkQrSvg || null;
  const fx = D.fx || [];
  const iss = D.iss || null;
  const habits = D.habits || [];
  const wod = D.wod || null;
  const sports = D.sports || null;
  const chores = D.chores || [];
  const chrome = D.chrome || {
    header: { enabled: true, left: '{city}', leftSub: '{date}', right: '{time}', rightSub: 'EDITION No. {edition}' },
    footer: { enabled: true, text: 'UPDATED {time} · REFRESH {refresh}MIN · THE DAILY {city}' }
  };

  // Minimal inline markdown (escaped first).
  function md(s) {
    return String(s || '')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>')
      .replace(/`(.+?)`/g, '<code>$1</code>');
  }

  // Setup-needed placeholder. Used by widgets when required config is
  // unset (e.g. no GitHub username, no photo uploaded). Renders a
  // clearly-marked card so the user notices "this needs config" instead
  // of the widget silently disappearing.
  // Binary-search the largest font-size that lets the element fit
  // entirely inside its own bounding box. Element must have an
  // explicit bounded box (via flex layout) for this to work.
  function autofitText(el) {
    if (!el) return;
    const maxW = el.clientWidth;
    const maxH = el.clientHeight;
    if (maxW <= 0 || maxH <= 0) return;
    // data-min-font enforces a per-tier readability floor — text smaller
    // than this dithers into unreadable noise on real e-ink. If the
    // content can't fit at the floor, accept clipping over illegibility.
    const minFont = Math.max(8, parseInt(el.getAttribute('data-min-font') || '11', 10));
    let lo = minFont, hi = 260;
    while (lo < hi) {
      const mid = Math.ceil((lo + hi) / 2);
      el.style.fontSize = mid + 'px';
      if (el.scrollWidth <= maxW + 1 && el.scrollHeight <= maxH + 1) lo = mid;
      else hi = mid - 1;
    }
    el.style.fontSize = lo + 'px';
  }

  // Resolve a cell size to a layout tier name (matches widgets.js pickTier).
  // density: 'rich' shifts tier up one step, 'sparse' shifts down one;
  // null/undefined/'balanced' = no change. Lets users dial info density
  // per tile without resizing.
  function pickTier(cellW, cellH, density) {
    const w = cellW || 0, h = cellH || 0;
    let byH = 'full';
    if (h < 4)       byH = 'tiny';
    else if (h < 6)  byH = 'compact';
    else if (h < 8)  byH = 'standard';
    else if (h < 12) byH = 'extended';
    let byW = 'full';
    if (w < 6)       byW = 'tiny';
    else if (w < 8)  byW = 'compact';
    else if (w < 12) byW = 'standard';
    else if (w < 18) byW = 'extended';
    const order = ['tiny', 'compact', 'standard', 'extended', 'full'];
    let idx = Math.min(order.indexOf(byH), order.indexOf(byW));
    if (density === 'rich')   idx = Math.min(idx + 1, order.length - 1);
    if (density === 'sparse') idx = Math.max(idx - 1, 0);
    return order[idx];
  }

  // Per-widget placeholder glyphs. Keep these chunky (stroke-width 4+)
  // so they survive the 1-bit threshold and don't dither on real panel.
  const PLACEHOLDER_ICONS = {
    clock:    '<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="24" fill="none" stroke="#000" stroke-width="4"/><line x1="32" y1="32" x2="32" y2="18" stroke="#000" stroke-width="4" stroke-linecap="round"/><line x1="32" y1="32" x2="42" y2="38" stroke="#000" stroke-width="4" stroke-linecap="round"/></svg>',
    weather:  '<svg viewBox="0 0 64 64"><path d="M 18 40 Q 10 40 10 32 Q 10 24 18 24 Q 18 14 28 14 Q 38 14 40 24 Q 52 24 52 34 Q 52 42 44 42 L 18 42 Z" fill="none" stroke="#000" stroke-width="4"/></svg>',
    calendar: '<svg viewBox="0 0 64 64"><rect x="8" y="14" width="48" height="42" fill="none" stroke="#000" stroke-width="4"/><line x1="8" y1="24" x2="56" y2="24" stroke="#000" stroke-width="4"/><line x1="20" y1="8" x2="20" y2="20" stroke="#000" stroke-width="4" stroke-linecap="round"/><line x1="44" y1="8" x2="44" y2="20" stroke="#000" stroke-width="4" stroke-linecap="round"/></svg>',
    todos:    '<svg viewBox="0 0 64 64"><rect x="12" y="14" width="14" height="14" fill="none" stroke="#000" stroke-width="4"/><line x1="32" y1="21" x2="56" y2="21" stroke="#000" stroke-width="4" stroke-linecap="round"/><rect x="12" y="38" width="14" height="14" fill="#000"/><polyline points="16,44 20,48 24,40" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="32" y1="45" x2="56" y2="45" stroke="#000" stroke-width="4" stroke-linecap="round"/></svg>',
    stocks:   '<svg viewBox="0 0 64 64"><polyline points="6,46 20,32 30,38 44,18 58,24" fill="none" stroke="#000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><line x1="6" y1="56" x2="58" y2="56" stroke="#000" stroke-width="4"/></svg>',
    photo:    '<svg viewBox="0 0 64 64"><rect x="6" y="10" width="52" height="44" fill="none" stroke="#000" stroke-width="4"/><circle cx="22" cy="24" r="4" fill="#000"/><polyline points="10,46 22,34 32,42 46,28 56,38" fill="none" stroke="#000" stroke-width="4" stroke-linejoin="round"/></svg>',
    news:     '<svg viewBox="0 0 64 64"><rect x="8" y="10" width="48" height="44" fill="none" stroke="#000" stroke-width="4"/><line x1="14" y1="22" x2="50" y2="22" stroke="#000" stroke-width="4"/><line x1="14" y1="32" x2="40" y2="32" stroke="#000" stroke-width="4"/><line x1="14" y1="40" x2="50" y2="40" stroke="#000" stroke-width="4"/><line x1="14" y1="48" x2="34" y2="48" stroke="#000" stroke-width="4"/></svg>',
    aqi:      '<svg viewBox="0 0 64 64"><path d="M 32 8 Q 14 22 14 38 Q 14 52 32 52 Q 50 52 50 38 Q 50 22 32 8 Z" fill="none" stroke="#000" stroke-width="4"/><path d="M 32 28 Q 28 36 32 44" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round"/></svg>',
    moonsun:  '<svg viewBox="0 0 64 64"><circle cx="22" cy="32" r="14" fill="#000"/><circle cx="28" cy="28" r="10" fill="#fff"/><path d="M 44 22 L 58 22 M 51 14 L 51 30" stroke="#000" stroke-width="4" stroke-linecap="round"/></svg>',
    wifi:     '<svg viewBox="0 0 64 64"><rect x="14" y="14" width="36" height="36" fill="none" stroke="#000" stroke-width="4"/><rect x="22" y="22" width="6" height="6" fill="#000"/><rect x="36" y="22" width="6" height="6" fill="#000"/><rect x="22" y="36" width="6" height="6" fill="#000"/><rect x="36" y="36" width="6" height="6" fill="#000"/></svg>',
    quote:    '<svg viewBox="0 0 64 64"><path d="M 12 24 Q 12 14 22 14 L 22 24 L 18 24 Q 18 32 22 32 L 22 38 Q 12 38 12 28 Z" fill="#000"/><path d="M 36 24 Q 36 14 46 14 L 46 24 L 42 24 Q 42 32 46 32 L 46 38 Q 36 38 36 28 Z" fill="#000"/></svg>',
    countdown:'<svg viewBox="0 0 64 64"><path d="M 18 8 L 46 8 L 46 18 Q 46 24 38 28 Q 38 32 38 36 Q 46 40 46 46 L 46 56 L 18 56 L 18 46 Q 18 40 26 36 Q 26 32 26 28 Q 18 24 18 18 Z" fill="none" stroke="#000" stroke-width="4"/><path d="M 24 18 L 40 18 L 32 28 Z" fill="#000"/></svg>',
    github:   '<svg viewBox="0 0 64 64"><rect x="6" y="20" width="10" height="10" fill="#000"/><rect x="20" y="20" width="10" height="10" fill="#fff" stroke="#000" stroke-width="4"/><rect x="34" y="20" width="10" height="10" fill="#000"/><rect x="48" y="20" width="10" height="10" fill="#fff" stroke="#000" stroke-width="4"/><rect x="6" y="34" width="10" height="10" fill="#fff" stroke="#000" stroke-width="4"/><rect x="20" y="34" width="10" height="10" fill="#000"/><rect x="34" y="34" width="10" height="10" fill="#000"/><rect x="48" y="34" width="10" height="10" fill="#fff" stroke="#000" stroke-width="4"/></svg>'
  };

  function placeholder(title, hint, iconKey) {
    const ic = iconKey && PLACEHOLDER_ICONS[iconKey];
    return `
      <div class="widget widget-placeholder">
        ${ic ? `<div class="ph-icon">${ic}</div>` : ''}
        <div class="ph-title">${title}</div>
        <div class="ph-hint">${hint}</div>
        <div class="ph-tag">SETUP NEEDED</div>
      </div>
    `;
  }

  // Inject accent color as CSS variable, if set.
  if (cfg.accent) {
    document.documentElement.style.setProperty('--accent', cfg.accent);
  }
  document.body.setAttribute('data-screen', String(screen));
  document.body.setAttribute('data-units', units);

  // ============ GRID CONFIG ============
  const GRID_COLS = 24;
  const GRID_ROWS = 12;

  function el(tag, cls, html) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  // Icon SVGs — pure black/white, scale to any size via CSS
  const ICONS = {
    Clear: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="22" fill="#000"/>
      ${Array.from({length:8}, (_,i)=>{
        const a = i*Math.PI/4;
        const x1 = 50 + 30*Math.cos(a), y1 = 50 + 30*Math.sin(a);
        const x2 = 50 + 42*Math.cos(a), y2 = 50 + 42*Math.sin(a);
        return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#000" stroke-width="5" stroke-linecap="round"/>`;
      }).join('')}</svg>`,
    Clouds: `<svg viewBox="0 0 100 100">
      <path d="M 25 65 Q 15 65 15 55 Q 15 45 25 45 Q 25 30 40 30 Q 55 30 58 45 Q 75 45 75 60 Q 75 70 65 70 L 25 70 Z"
        fill="#000"/></svg>`,
    Rain: `<svg viewBox="0 0 100 100">
      <path d="M 25 50 Q 15 50 15 40 Q 15 30 25 30 Q 25 18 40 18 Q 55 18 58 30 Q 75 30 75 45 Q 75 55 65 55 L 25 55 Z"
        fill="#000"/>
      <line x1="30" y1="65" x2="26" y2="80" stroke="#000" stroke-width="4" stroke-linecap="round"/>
      <line x1="50" y1="65" x2="46" y2="80" stroke="#000" stroke-width="4" stroke-linecap="round"/>
      <line x1="70" y1="65" x2="66" y2="80" stroke="#000" stroke-width="4" stroke-linecap="round"/>
    </svg>`,
    Thunderstorm: `<svg viewBox="0 0 100 100">
      <path d="M 25 45 Q 15 45 15 35 Q 15 25 25 25 Q 25 12 40 12 Q 55 12 58 25 Q 75 25 75 40 Q 75 50 65 50 L 25 50 Z"
        fill="#000"/>
      <polygon points="48,55 38,75 48,75 42,90 60,68 50,68 56,55" fill="#000"/>
    </svg>`,
    Snow: `<svg viewBox="0 0 100 100">
      <path d="M 25 45 Q 15 45 15 35 Q 15 25 25 25 Q 25 12 40 12 Q 55 12 58 25 Q 75 25 75 40 Q 75 50 65 50 L 25 50 Z"
        fill="#000"/>
      ${[30,50,70].map(x => `
        <g stroke="#000" stroke-width="3" stroke-linecap="round">
          <line x1="${x-6}" y1="70" x2="${x+6}" y2="70"/>
          <line x1="${x}" y1="64" x2="${x}" y2="76"/>
          <line x1="${x-4}" y1="66" x2="${x+4}" y2="74"/>
          <line x1="${x-4}" y1="74" x2="${x+4}" y2="66"/>
        </g>
      `).join('')}
    </svg>`,
    Mist: `<svg viewBox="0 0 100 100">
      ${[30,45,60,75].map((y,i) => `
        <line x1="${15 + (i%2)*5}" y1="${y}" x2="${85 - (i%2)*5}" y2="${y}"
          stroke="#000" stroke-width="5" stroke-linecap="round"/>
      `).join('')}
    </svg>`
  };
  ICONS.Drizzle = ICONS.Rain;
  ICONS.Fog = ICONS.Mist;
  ICONS.Haze = ICONS.Mist;

  function icon(main, size) {
    const svg = ICONS[main] || ICONS.Clear;
    return `<span class="icon" style="width:${size}px;height:${size}px">${svg}</span>`;
  }

  // Day-progress bar between sunrise and sunset. Renders nothing if the
  // weather payload lacks the parsed minute timestamps.
  function sunBar(w) {
    if (!w || !Number.isFinite(w.sunriseMin) || !Number.isFinite(w.sunsetMin)) return '';
    const sr = w.sunriseMin, ss = w.sunsetMin;
    const nowM = Number.isFinite(w.nowMin) ? w.nowMin : sr;
    let pct;
    if (nowM < sr) pct = 0;
    else if (nowM > ss) pct = 100;
    else pct = ((nowM - sr) / (ss - sr)) * 100;
    return `
      <div class="sun-bar">
        <div class="sun-track">
          <div class="sun-fill" style="width:${pct.toFixed(1)}%"></div>
          <div class="sun-dot" style="left:${pct.toFixed(1)}%"></div>
        </div>
        <div class="sun-labels">
          <span>↑ ${w.sunrise}</span>
          <span>↓ ${w.sunset}</span>
        </div>
      </div>
    `;
  }

  function hourlyStrip(w) {
    if (!w || !Array.isArray(w.hourly) || !w.hourly.length) return '';
    // Threshold: only render the pill at >=10% chance — anything below
    // is visual noise on a 1-bit panel + read as battery / unrelated UI.
    return `
      <div class="hourly-strip">
        ${w.hourly.map(h => `
          <div class="hr-cell">
            <div class="hr-time">${h.label}</div>
            ${icon(h.main, 22)}
            <div class="hr-temp">${h.temp}°</div>
            ${Number.isFinite(h.precip) && h.precip >= 10
              ? `<div class="hr-precip-pct">${h.precip}%</div>`
              : ''}
          </div>
        `).join('')}
      </div>
    `;
  }

  function alertBanner(w) {
    if (!w || !Array.isArray(w.alerts) || !w.alerts.length) return '';
    const a = w.alerts[0];
    return `
      <div class="weather-alert">
        <span class="alert-tag">⚠ ${a.severity || 'ALERT'}</span>
        <span class="alert-text">${a.event}</span>
      </div>
    `;
  }

  // ============ WIDGET REGISTRY ============
  // Each widget: { id, label, requires, sizes, defaultSize, render(ctx) }
  // The dashboard renderer is data-only; w/h come from the saved layout
  // (the editor picks them from `sizes` presets).
  const WIDGET_REGISTRY = [
    {
      id: 'weather_hero',
      label: 'Weather (current)',
      requires: 'weather',
      sizes: { XS:{w:8,h:4}, S:{w:8,h:6}, M:{w:8,h:12}, L:{w:12,h:12}, XL:{w:24,h:12} },
      defaultSize: 'M',
      render: ({ weather, units, cellW, cellH, cfg, density }) => {
        if (!weather) {
          if (!Number.isFinite(cfg.lat) || !Number.isFinite(cfg.lon)) {
            return placeholder('WEATHER', 'Set your location in settings', 'weather');
          }
          return placeholder('WEATHER', 'Data unavailable', 'weather');
        }
        const tier = pickTier(cellW, cellH, density);
        const staleClass = weather.stale ? ' weather-stale' : '';
        const staleBadge = weather.stale ? '<div class="stale-pill">CACHED</div>' : '';

        const tempBlock = (size) => `
          <div class="weather-temp" style="font-size:${size}px">
            <span class="temp-num">${weather.temp}</span><span class="temp-deg" style="font-size:${Math.round(size*0.6)}px">°${units}</span>
          </div>`;
        const heroIcon = (px) => `<div class="weather-icon" style="height:${px}px">${icon(weather.main, px)}</div>`;
        const descLine = () => `<div class="weather-desc">${weather.desc}</div>`;
        const hiloLine = () => `<div class="weather-hilo">HIGH ${weather.tempMax}° &nbsp;·&nbsp; LOW ${weather.tempMin}°</div>`;
        const statsBlock = () => `
          <div class="weather-stats">
            <div class="stat"><span class="stat-k">FEELS</span><span class="stat-v">${weather.feelsLike}°</span></div>
            <div class="stat"><span class="stat-k">HUMID</span><span class="stat-v">${weather.humidity}%</span></div>
            <div class="stat"><span class="stat-k">WIND</span><span class="stat-v">${weather.windDir} ${weather.windSpeed}${weather.windGust ? ` (G${weather.windGust})` : ''} ${weather.windUnit || ''}</span></div>
            <div class="stat"><span class="stat-k">${Number.isFinite(weather.cloudCover) ? 'CLOUD' : 'RISE'}</span><span class="stat-v">${Number.isFinite(weather.cloudCover) ? weather.cloudCover + '%' : weather.sunrise}</span></div>
          </div>`;

        switch (tier) {
          case 'tiny':
            // Only the number — fits inside ~33×100px or smaller.
            return `<div class="weather-hero hero-tier-tiny${staleClass}">
              ${staleBadge}${tempBlock(54)}
            </div>`;
          case 'compact':
            // Icon + temp side-by-side; no stats.
            return `<div class="weather-hero hero-tier-compact${staleClass}">
              ${staleBadge}
              <div class="hero-row">${heroIcon(60)}${tempBlock(72)}</div>
              ${hiloLine()}
            </div>`;
          case 'standard':
            // Vertical hero + descriptor + stats grid. No alerts or extras.
            return `<div class="weather-hero hero-tier-standard${staleClass}">
              ${staleBadge}${heroIcon(90)}${tempBlock(86)}${descLine()}${hiloLine()}
            </div>${statsBlock()}`;
          case 'extended':
            // Standard + alert banner (no hourly / sun bar).
            return `<div class="weather-hero hero-tier-extended${staleClass}">
              ${staleBadge}${heroIcon(110)}${tempBlock(96)}${descLine()}${hiloLine()}
            </div>${alertBanner(weather)}${statsBlock()}`;
          case 'full':
          default:
            // Everything: hero + alert + stats + sun bar + hourly strip.
            return `<div class="weather-hero hero-tier-full${staleClass}">
              ${staleBadge}${heroIcon(130)}${tempBlock(96)}${descLine()}${hiloLine()}
            </div>${alertBanner(weather)}${statsBlock()}${sunBar(weather)}${hourlyStrip(weather)}`;
        }
      }
    },
    {
      id: 'weather_forecast',
      label: 'Weather Forecast',
      requires: 'weather',
      sizes: { S:{w:6,h:8}, M:{w:6,h:12}, L:{w:12,h:12}, XL:{w:24,h:6} },
      defaultSize: 'M',
      render: ({ weather, cellW, cellH, cfg, density }) => {
        if (!weather || !weather.forecast || !weather.forecast.length) {
          if (!Number.isFinite(cfg.lat) || !Number.isFinite(cfg.lon)) {
            return placeholder('FORECAST', 'Set your location in settings', 'weather');
          }
          return placeholder('FORECAST', 'Data unavailable', 'weather');
        }
        // Forecast is a vertical list. Day count is user-configurable
        // via cfg.weather.forecastDays (1-7); falls back to a cellH-driven
        // auto value when unset. Auto packs the cell tighter at large
        // sizes than the old fixed cap.
        const h = cellH || 0, w = cellW || 0;
        const userDays = parseInt((cfg && cfg.weather && cfg.weather.forecastDays), 10);
        const autoDays = h < 4 ? 1
                       : h < 6 ? 2
                       : h < 8 ? 3
                       : h < 10 ? 4
                       : h < 12 ? 5
                       : 7;
        const days = Number.isFinite(userDays)
          ? Math.max(1, Math.min(7, userDays))
          : autoDays;
        const iconPx = h < 4 ? 26 : h < 6 ? 28 : h < 8 ? 32 : h < 12 ? 34 : 38;
        const showPrecip = w >= 8;
        const t = { days, iconPx, showPrecip };
        const list = weather.forecast.slice(0, t.days);
        return `
          <div class="col-title">${list.length}-DAY OUTLOOK</div>
          ${list.map(f => `
            <div class="fc-row">
              <div class="fc-day">${f.name}</div>
              <div class="fc-icon">${icon(f.main, t.iconPx)}</div>
              <div class="fc-hilo">
                <div class="fc-hi">${f.hi}°</div>
                <div class="fc-lo">${f.lo}°</div>
              </div>
              ${t.showPrecip && Number.isFinite(f.precip) && f.precip > 0
                ? `<div class="fc-precip">${f.precip}%</div>` : '<div class="fc-precip"></div>'}
            </div>
          `).join('')}
        `;
      }
    },
    {
      id: 'message',
      label: 'Custom Message',
      requires: 'message',
      sizes: { XS:{w:8,h:3}, S:{w:8,h:4}, M:{w:10,h:4}, L:{w:24,h:4}, XL:{w:24,h:6} },
      defaultSize: 'M',
      render: ({ cfg, resolvedMessage, cellW, cellH, density }) => {
        const m = resolvedMessage || cfg.message;
        if (!m || !m.text) return placeholder('MESSAGE', 'Set a headline in settings', 'quote');
        const tier = pickTier(cellW, cellH, density);
        const matrix = {
          tiny:     { txtSize: 14, subSize: 10, showSub: false },
          compact:  { txtSize: 18, subSize: 11, showSub: true  },
          standard: { txtSize: 22, subSize: 12, showSub: true  },
          extended: { txtSize: 28, subSize: 13, showSub: true  },
          full:     { txtSize: 36, subSize: 14, showSub: true  }
        };
        const t = matrix[tier];
        return `
          <div class="widget widget-msg">
            <div class="msg-text" style="font-size:${t.txtSize}px">${md(escapeHtml(m.text))}</div>
            ${t.showSub && m.subtitle ? `<div class="msg-sub" style="font-size:${t.subSize}px">${md(escapeHtml(m.subtitle))}</div>` : ''}
          </div>
        `;
      }
    },
    {
      id: 'todos',
      label: 'To-Do List',
      requires: 'todos',
      sizes: { S:{w:8,h:6}, M:{w:10,h:6}, L:{w:12,h:12}, XL:{w:24,h:12} },
      defaultSize: 'M',
      render: ({ todos, cellW, cellH, density }) => {
        if (!todos || !todos.length) return placeholder('TODO', 'Add items in settings', 'todos');
        const today = (() => {
          const d = new Date();
          return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        })();
        const tier = pickTier(cellW, cellH, density);
        const matrix = {

          return h * 60 + min;
        }

        const ssM = parseClock(moonsun.sunset);

  function widgetById(id) {
    return WIDGET_REGISTRY.find(w => w.id === id);
  }

  // Per-screen defaults — match control-src/widgets.js.
  const DEFAULT_LAYOUTS = {
    1: [
      { id:'weather_hero',     x:0,  y:0, size:'M', enabled:true },
      { id:'weather_forecast', x:8,  y:0, size:'M', enabled:true },
      { id:'message',          x:14, y:0, size:'M', enabled:true },
      { id:'todos',            x:14, y:4, size:'M', enabled:true },
      { id:'calendar',         x:14, y:8, size:'M', enabled:false },
      { id:'spacer',           x:0, y:0, size:'S', enabled:false },
      { id:'quote',            x:0, y:0, size:'M', enabled:false }
    ],
    2: [
      { id:'weather_hero',     x:0, y:0, size:'XL', enabled:true },
      { id:'weather_forecast', x:0, y:0, size:'M',  enabled:false },
      { id:'message',          x:0, y:0, size:'M',  enabled:false },
      { id:'todos',            x:0, y:0, size:'M',  enabled:false },
      { id:'calendar',         x:0, y:0, size:'M',  enabled:false },
      { id:'spacer',           x:0, y:0, size:'S',  enabled:false },
      { id:'quote',            x:0, y:0, size:'M',  enabled:false }
    ]
  };

  function sizeFor(def, sizeKey) {
    const k = sizeKey && def.sizes[sizeKey] ? sizeKey : def.defaultSize;
    return { size: k, ...def.sizes[k] };
  }

  // Resolve a raw saved layout array into one with explicit w/h. Stored
  // geometry wins; size preset is the fallback.
  function expandLayout(rawLayout) {
    const items = [];
    for (const raw of (rawLayout || [])) {
      if (raw.enabled === false) continue; // legacy: disabled = not rendered
      const widgetId = raw.widgetId || raw.id;
      const def = widgetById(widgetId);
      if (!def) continue;
      const sz = sizeFor(def, raw.size);
      items.push({
        id: raw.id || widgetId,
        widgetId,
        x: Number.isFinite(raw.x) ? raw.x : 0,
        y: Number.isFinite(raw.y) ? raw.y : 0,
        w: Number.isFinite(raw.w) ? raw.w : sz.w,
        h: Number.isFinite(raw.h) ? raw.h : sz.h,
        flush: !!raw.flush
      });
    }
    return items;
  }

  // Resolve which layout to render. Order of precedence:
  //  1. D.layout (server-supplied — new screens schema)
  //  2. cfg.layouts[screen]               — legacy per-screen map
  //  3. cfg.layout                        — legacy single layout
  //  4. cfg.widgets booleans              — oldest config shape
  //  5. DEFAULT_LAYOUTS[1]                — final fallback
  function resolveLayout() {
    if (Array.isArray(D.layout) && D.layout.length) return expandLayout(D.layout);
    const s = (screen === 2) ? 2 : 1;
    if (cfg.layouts && Array.isArray(cfg.layouts[s]) && cfg.layouts[s].length) {
      return expandLayout(cfg.layouts[s]);
    }
    if (Array.isArray(cfg.layout) && cfg.layout.length) {
      return expandLayout(cfg.layout);
    }
    if (cfg.widgets && Object.keys(cfg.widgets).length) {
      const base = DEFAULT_LAYOUTS[s].map(d => {
        const def = widgetById(d.id);
        return { ...d, enabled: !!widgets[def?.requires] };
      });
      return expandLayout(base);
    }
    return expandLayout(DEFAULT_LAYOUTS[s]);
  }

  const page = document.getElementById('page');

  // ============ MATRIX MODE ============
  // /widgets-matrix renders every widget at every preset size for
  // visual QA. We branch the entire render here and bail before the
  // normal layout pipeline runs.
  if (D.mode === 'matrix') {
    document.body.style.width = '100vw';
    document.body.style.height = 'auto';
    document.documentElement.style.width = '100vw';
    document.documentElement.style.height = 'auto';
    page.style.cssText = 'width:100%;height:auto;display:flex;flex-direction:column;gap:32px;padding:32px;background:#fff';
    const ctxMatrix = {
      cfg, weather: w, events, todos, units,
      aqi, news, stocks, github, wifiQrSvg, clockNow, countdowns, moonsun,
      resolvedQuote, resolvedMessage, resolvedPhoto,
      counters, linkQrSvg, fx, iss, habits, wod, sports, chores
    };
    // ~33px per grid cell (800/24 horiz, 480/12 vert with chrome off).
    const PX_W = 800 / 24, PX_H = 480 / 12;
    for (const def of WIDGET_REGISTRY) {
      const sizes = def.sizes || {};
      const sizeKeys = Object.keys(sizes);
      for (const key of sizeKeys) {
        const { w: cw, h: ch } = sizes[key];
        const cellWidth = cw * PX_W;
        const cellHeight = ch * PX_H;
        const inner = (def.render && def.render({ ...ctxMatrix, cellW: cw, cellH: ch })) || '';
        const card = el('div');
        card.style.cssText = 'border:2px solid #000;background:#fff';
        card.innerHTML = `
          <div style="display:flex;justify-content:space-between;padding:8px 12px;background:#000;color:#fff;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:2px;">
            <span>${def.id} · ${key}</span>
            <span>${cw}×${ch} · ${Math.round(cellWidth)}×${Math.round(cellHeight)}px · ${(function(){const _w=cw,_h=ch;let bH='full';if(_h<4)bH='tiny';else if(_h<6)bH='compact';else if(_h<8)bH='standard';else if(_h<12)bH='extended';let bW='full';if(_w<6)bW='tiny';else if(_w<8)bW='compact';else if(_w<12)bW='standard';else if(_w<18)bW='extended';const order=['tiny','compact','standard','extended','full'];return order[Math.min(order.indexOf(bH),order.indexOf(bW))];})()}</span>
          </div>
          <div class="cell cell-${def.id}" style="width:${cellWidth}px;height:${cellHeight}px;margin:0">${inner}</div>
        `;
        page.appendChild(card);
      }
    }
    // Autofit must run after cards are in the DOM so .autofit elements
    // have a measurable box. Wait for web fonts so measurement matches
    // the real rendered glyphs (otherwise clock measures fallback serif
    // and locks in a tiny size).
    const runMatrixAutofit = () => requestAnimationFrame(() => {
      document.querySelectorAll('.autofit').forEach(autofitText);
      window.__autofitDone = true;
    });
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(runMatrixAutofit);
    } else {
      runMatrixAutofit();
    }
    return; // skip the rest of the normal render
  }

  // ============ HEADER ============
  const cityLabel = (cfg.cityLabel || cfg.city || '').toString();

  // Header time/date must reflect REAL clock, not weather observation time
  // (weather is cached 10min and `cur.time` only updates hourly upstream).
  const tz = cfg.timezone || 'UTC';
  const now = new Date();
  let timeStr = '';
  let dateStr = '';
  try {
    timeStr = new Intl.DateTimeFormat('en-US', {
      timeZone: tz, hour: 'numeric', minute: '2-digit', hour12: true
    }).format(now).toUpperCase();
    dateStr = new Intl.DateTimeFormat('en-US', {
      timeZone: tz, weekday: 'short', month: 'short', day: 'numeric', year: 'numeric'
    }).format(now).toUpperCase();
  } catch {
    timeStr = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    dateStr = now.toDateString().toUpperCase();
  }

  // Token substitution for header/footer chrome.
  const editionNo = Math.floor(Date.now() / 3600000) % 9999;
  const battery = D.battery || null;
  const battPct = battery && Number.isFinite(battery.pct) ? battery.pct : null;
  const battV   = battery && Number.isFinite(battery.v)   ? battery.v   : null;
  const battAgeMin = battery && Number.isFinite(battery.at)
    ? Math.max(0, Math.round((Date.now() - battery.at) / 60000))
    : null;
  const battAgeLabel = battAgeMin == null ? '—'
    : battAgeMin < 60 ? `${battAgeMin}m`
    : `${Math.round(battAgeMin / 60)}h`;
  const tokens = {
    '{city}': cityLabel || '',
    '{time}': timeStr || '',
    '{date}': dateStr || '',
    '{refresh}': String(cfg.refreshMinutes || 30),
    '{edition}': String(editionNo),
    '{battery}': battPct != null ? `${battPct}%` : '—',
    '{battpct}': battPct != null ? String(battPct) : '—',
    '{battv}':   battV   != null ? `${battV.toFixed(2)}V` : '—',
    '{battage}': battAgeLabel
  };
  function tpl(s) {
    let out = String(s || '');
    for (const k in tokens) out = out.split(k).join(tokens[k]);
    return out;
  }

  // Page grid rows depend on which chrome bars are enabled.
  // minmax(0, 1fr) prevents body content from pushing the page taller.
  const headerOn = chrome.header && chrome.header.enabled !== false;
  const footerOn = chrome.footer && chrome.footer.enabled !== false;
  const headerRow = headerOn ? '60px' : '0px';
  const footerRow = footerOn ? '28px' : '0px';
  page.style.gridTemplateRows = `${headerRow} minmax(0, 1fr) ${footerRow}`;

  if (headerOn) {
    const h = chrome.header || {};
    const variant = (h.variant || 'masthead').toLowerCase();
    const header = el('header', `hdr hdr-${variant}`);
    header.innerHTML = `
      <div class="hdr-left">
        <div class="hdr-city">${escapeHtml(tpl(h.left))}</div>
        ${h.leftSub ? `<div class="hdr-date">${escapeHtml(tpl(h.leftSub))}</div>` : ''}
      </div>
      <div class="hdr-right">
        <div class="hdr-time">${escapeHtml(tpl(h.right))}</div>
        ${h.rightSub ? `<div class="hdr-meta">${escapeHtml(tpl(h.rightSub))}</div>` : ''}
      </div>
    `;
    page.appendChild(header);
  } else {
    // CSS grid still expects a row 1 child — render a zero-height stub.
    page.appendChild(el('div', 'hdr-stub'));
  }

  // ============ MAIN BODY — CSS GRID ============
  // minmax(0, 1fr) prevents wide cell content from pushing the column
  // wider than its share (default 1fr = minmax(auto, 1fr) lets content
  // overflow the page horizontally).
  const body = el('main', 'body body-grid');
  body.style.gridTemplateColumns = `repeat(${GRID_COLS}, minmax(0, 1fr))`;
  body.style.gridTemplateRows    = `repeat(${GRID_ROWS}, minmax(0, 1fr))`;
  page.appendChild(body);

  const ctx = {
    cfg, weather: w, events, todos, units,
    aqi, news, stocks, github, wifiQrSvg, clockNow, countdowns, moonsun,
    resolvedQuote, resolvedMessage, resolvedPhoto,
    counters, linkQrSvg, fx, iss, habits, wod, sports, chores,
    chrome, headerOn, footerOn
  };
  const layout = resolveLayout();

  // Compute the wall-clock minute-of-day for visibility gating.
  function nowMinsTZ(tz) {
    try {
      const parts = new Intl.DateTimeFormat('en-US', {
        timeZone: tz || 'UTC', hour12: false, hour: '2-digit', minute: '2-digit'
      }).formatToParts(new Date());
      let h = 0, m = 0;
      for (const p of parts) {
        if (p.type === 'hour') h = parseInt(p.value, 10) % 24;
        if (p.type === 'minute') m = parseInt(p.value, 10);
      }
      return h * 60 + m;
    } catch { return new Date().getHours() * 60 + new Date().getMinutes(); }
  }
  function parseHHMM(s) {
    const m = String(s || '').match(/^(\d{1,2}):(\d{2})$/);
    if (!m) return null;
    return parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
  }
  function withinVisibility(vis, nowM) {
    if (!vis || !vis.enabled) return true;
    const a = parseHHMM(vis.from), b = parseHHMM(vis.to);
    if (a == null || b == null) return true;
    if (a === b) return true;
    if (a < b) return nowM >= a && nowM < b;
    return nowM >= a || nowM < b; // wraps midnight
  }
  const nowM = nowMinsTZ(cfg.timezone || 'UTC');

  let anyRendered = false;
  for (const item of layout) {
    const def = widgetById(item.widgetId || item.id);
    if (!def) continue;
    if (!withinVisibility(item.visibility, nowM)) continue;
    const itemCtx = { ...ctx, cellW: item.w, cellH: item.h, density: item.density };
    const inner = def.render(itemCtx);
    if (!inner) continue;
    const classes = ['cell', `cell-${def.id}`];
    if (item.x + item.w >= GRID_COLS) classes.push('cell-edge-right');
    if (item.y + item.h >= GRID_ROWS) classes.push('cell-edge-bottom');
    if (item.flush) classes.push('cell-flush');
    if (item.border === 'dashed') classes.push('cell-border-dashed');
    if (item.border === 'none')   classes.push('cell-border-none');
    const cell = el('div', classes.join(' '), inner);
    cell.style.gridColumn = `${item.x + 1} / span ${item.w}`;
    cell.style.gridRow    = `${item.y + 1} / span ${item.h}`;
    body.appendChild(cell);
    anyRendered = true;
  }

  if (!anyRendered) {
    const empty = el('div', 'empty terminal-empty', '> NO_WIDGETS_ENABLED');
    empty.style.gridColumn = `1 / span ${GRID_COLS}`;
    empty.style.gridRow    = `1 / span ${GRID_ROWS}`;
    body.appendChild(empty);
  }

  // ============ FOOTER ============
  if (footerOn) {
    const f = chrome.footer || {};
    const variant = (f.variant || 'editorial').toLowerCase();
    const footer = el('footer', `ftr ftr-${variant}`);
    // Render with a leading bullet so the editorial rhythm is preserved
    // even when the user customizes the text.
    const battBadge = f.showBattery
      ? `<span class="ftr-battery">BAT ${escapeHtml(tokens['{battery}'])}${battAgeMin != null ? ` · ${escapeHtml(battAgeLabel)}` : ''}</span>`
      : '';
    footer.innerHTML = `<span class="ftr-bullet">●</span> ${escapeHtml(tpl(f.text))}${battBadge}`;
    page.appendChild(footer);
  } else {
    page.appendChild(el('div', 'ftr-stub'));
  }

  // After every cell has been placed + laid out, run autofit on
  // marked text elements. Wait for web fonts so measurement uses the
  // real glyph metrics, not fallback serif. Set window.__autofitDone
  // so Puppeteer can wait for it before screenshotting.
  const runAutofit = () => requestAnimationFrame(() => {
    document.querySelectorAll('.autofit').forEach(autofitText);
    window.__autofitDone = true;
  });
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(runAutofit);
  } else {
    runAutofit();
  }

})();
</script>
</body>
</html>
