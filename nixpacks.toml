[phases.setup]
# nodejs_22: vite 8 requires node ^20.19 || >=22.12; 22 LTS removes the
# "which 20.x minor does nix ship" gamble.
# tini: PID-1 init that reaps zombies. Puppeteer's Chromium spawns a
# chrome_crashpad_handler that gets re-parented to PID 1 when the browser
# dies; bare `node` never reaps it, so those zombies accumulated and
# exhausted the container PID table (fork: EAGAIN -> fleet-down, Aug 2026).
nixPkgs = ['nodejs_22', 'chromium', 'tini']

[phases.install]
# Railway injects NPM_CONFIG_PRODUCTION=true into every build; that's
# the legacy form of `omit=dev` which npm v9+ deprecates with a noisy
# warning Railway then surfaces at severity=error. `env -u` unsets it
# just for the npm invocation. `--include=dev` is belt-and-suspenders
# so vite + @vitejs/plugin-react actually install.
cmds = ['env -u NPM_CONFIG_PRODUCTION npm install --include=dev --loglevel=error']

[phases.build]
cmds = ['env -u NPM_CONFIG_PRODUCTION npm run build --loglevel=error']

[start]
# `tini -g --` so signals + zombie-reaping cover the whole process group,
# including any orphaned Chromium helpers. Without an init, `node` runs as
# PID 1 and leaks zombie crashpad handlers until the PID table is exhausted.
cmd = 'tini -g -- node server.js'

[variables]
PUPPETEER_SKIP_DOWNLOAD = '1'
PUPPETEER_EXECUTABLE_PATH = '/nix/var/nix/profiles/default/bin/chromium'
# Mutable state (config/battery/devices) lives here. Must match the
# Railway Volume mount path (currently /app/data) so config survives
# redeploys. This also equals the code default (__dirname/data = /app/data
# at runtime), but set explicitly so the dependency is documented.
DATA_DIR = '/app/data'
