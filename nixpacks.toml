[phases.setup]
nixPkgs = ['nodejs_20', 'chromium']

[phases.install]
# Railway injects NPM_CONFIG_PRODUCTION=true into every build; that's
# the legacy form of `omit=dev` which npm v9+ deprecates with a noisy
# warning Railway then surfaces at severity=error. `env -u` unsets it
# just for the npm invocation. `--include=dev` is belt-and-suspenders
# so vite + @vitejs/plugin-react actually install.
cmds = ['env -u NPM_CONFIG_PRODUCTION npm install --include=dev --loglevel=error']

[phases.build]
cmds = ['env -u NPM_CONFIG_PRODUCTION npm run build --loglevel=error']

[start]
cmd = 'node server.js'

[variables]
PUPPETEER_SKIP_DOWNLOAD = '1'
PUPPETEER_EXECUTABLE_PATH = '/nix/var/nix/profiles/default/bin/chromium'
